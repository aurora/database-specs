# yaml-language-server: $schema=../../schemas/capability.schema.json
id: dml.returning
title: RETURNING clause on INSERT/UPDATE/DELETE
description: Return rows affected by a DML statement in the same round trip.
support:
  sqlserver:
    - status: unsupported
      notes: ["Use the OUTPUT clause instead (see dml.output-clause): INSERT ... OUTPUT inserted.id VALUES (...)."]
  postgresql:
    - since: "8.2"
      status: supported
      notes: ["INSERT, UPDATE, DELETE; MERGE ... RETURNING since 17. OLD/NEW aliases in RETURNING since 18."]
  mysql:
    - status: unsupported
      notes: ["Use LAST_INSERT_ID() / ROW_COUNT(); MariaDB has INSERT/DELETE ... RETURNING."]
  mariadb:
    - until: "10.5"
      status: partial
      notes: ["DELETE ... RETURNING only (single-table DELETE, since 10.0.5); INSERT / REPLACE ... RETURNING is a syntax error before 10.5."]
    - since: "10.5"
      status: partial
      notes:
        - "INSERT ... RETURNING and REPLACE ... RETURNING since 10.5; DELETE ... RETURNING already since 10.0.5."
        - "No UPDATE ... RETURNING: syntax error 1064 (observed 11.4.13); the 12.3.3 grammar uses RETURNING only in INSERT, REPLACE and single-table DELETE."
        - "RETURNING cannot reference subqueries on the target table and does not support aggregates."
  sqlite:
    - until: "3.35"
      status: unsupported
    - since: "3.35"
      status: supported
      notes:
        - "INSERT, UPDATE, DELETE (also UPSERT). Not usable inside triggers or as a subquery/CTE; the order of returned rows is not guaranteed."
  manticore:
    - status: unsupported
  sphinx:
    - status: unsupported
probes:
  - engines: [mysql, postgresql, sqlite]
    setup: ["CREATE TEMPORARY TABLE probe_returning (id INT)"]
    statements: ["INSERT INTO probe_returning (id) VALUES (1) RETURNING id"]
    cleanup: ["DROP TABLE IF EXISTS probe_returning"]
  - engines: [mariadb]
    since: "10.5"
    setup: ["CREATE TEMPORARY TABLE probe_returning (id INT)"]
    statements: ["INSERT INTO probe_returning (id) VALUES (1) RETURNING id"]
    cleanup: ["DROP TABLE IF EXISTS probe_returning"]
  - engines: [mariadb]
    until: "10.5"
    setup: ["CREATE TEMPORARY TABLE probe_returning (id INT)", "INSERT INTO probe_returning (id) VALUES (1)"]
    statements: ["DELETE FROM probe_returning WHERE id = 1 RETURNING id"]
    cleanup: ["DROP TABLE IF EXISTS probe_returning"]
  - engines: [sqlserver]
    setup: ["CREATE TABLE #probe_returning (id INT)"]
    statements: ["INSERT INTO #probe_returning (id) VALUES (1) RETURNING id"]
    cleanup: ["DROP TABLE IF EXISTS #probe_returning"]
  - engines: [manticore]
    setup:
      - "CREATE TABLE probe_mt (title TEXT, v INT)"
    statements:
      - "INSERT INTO probe_mt (id, v) VALUES (1, 1) RETURNING id"
    cleanup: ["DROP TABLE IF EXISTS probe_mt"]
  - engines: [sphinx]
    setup:
      - "TRUNCATE RTINDEX t_ed"
    statements:
      - "INSERT INTO t_ed (id, n) VALUES (1, 1) RETURNING id"
    cleanup:
      - "TRUNCATE RTINDEX t_ed"
