# yaml-language-server: $schema=../../schemas/capability.schema.json
id: query.cte-recursive
title: Recursive common table expressions
description: Self-referencing CTEs. Most engines require WITH RECURSIVE; T-SQL has no RECURSIVE keyword.
related: [query.cte]
support:
  mysql:
    - until: "8.0"
      status: unsupported
    - since: "8.0"
      status: supported
      notes: ["Recursion depth limited by cte_max_recursion_depth (default 1000)."]
  mariadb:
    - since: "10.2.2"
      status: supported
      notes: ["Recursion depth limited by max_recursive_iterations; CYCLE ... RESTRICT clause since 10.5.2."]
  sqlserver:
    - since: "9"
      status: supported
      notes:
        - "Written as plain WITH - 'WITH RECURSIVE' is a syntax error."
        - "Recursion limited to 100 levels by default; OPTION (MAXRECURSION n) at the end of the statement (0 = unlimited)."
  postgresql:
    - since: "8.4"
      status: supported
      notes: ["SEARCH and CYCLE clauses since 14."]
  sqlite:
    - since: "3.8.3"
      status: supported
      notes: ["The RECURSIVE keyword is optional; no depth limit besides LIMIT in the recursive query."]
  manticore:
    - status: unsupported
      notes: ["No WITH at all (see query.cte)."]
probes:
  - engines: [mysql, mariadb, postgresql, sqlite]
    statements: ["WITH RECURSIVE r (n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM r WHERE n < 3) SELECT n FROM r"]
  - name: tsql
    engines: [sqlserver]
    statements: ["WITH r (n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM r WHERE n < 3) SELECT n FROM r"]
  - engines: [manticore]
    setup:
      - "CREATE TABLE probe_mt (title TEXT, v INT)"
    statements:
      - "WITH RECURSIVE x AS (SELECT id FROM probe_mt) SELECT id FROM x"
    cleanup: ["DROP TABLE IF EXISTS probe_mt"]
