# yaml-language-server: $schema=../../schemas/capability.schema.json
id: query.cte
title: Common table expressions (WITH)
related: [query.cte-recursive]
support:
  mysql:
    - until: "8.0"
      status: unsupported
    - since: "8.0"
      status: supported
  mariadb:
    - since: "10.2.1"
      status: supported
  sqlserver:
    - since: "9"
      status: supported
      notes: ["A preceding statement in the same batch must be terminated with ';' before WITH."]
  postgresql:
    - since: "8.4"
      status: supported
      notes: ["Since 12, non-recursive side-effect-free CTEs referenced once are inlined; MATERIALIZED / NOT MATERIALIZED control this."]
  sqlite:
    - since: "3.8.3"
      status: supported
      notes: ["MATERIALIZED / NOT MATERIALIZED hints since 3.35."]
  manticore:
    - status: unsupported
probes:
  - engines: [mysql, mariadb, postgresql, sqlserver, sqlite]
    statements: ["WITH x AS (SELECT 1 AS n) SELECT n FROM x"]
  - engines: [manticore]
    setup:
      - "CREATE TABLE probe_mt (title TEXT, v INT)"
    statements:
      - "WITH x AS (SELECT id FROM probe_mt) SELECT id FROM x"
    cleanup: ["DROP TABLE IF EXISTS probe_mt"]
