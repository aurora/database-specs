# yaml-language-server: $schema=../../schemas/capability.schema.json
id: query.fetch-first
title: SQL-standard OFFSET ... ROWS FETCH FIRST ... ROWS ONLY
related: [query.limit-offset]
support:
  mysql:
    - status: unsupported
  mariadb:
    - until: "10.6"
      status: unsupported
    - since: "10.6"
      status: supported
      notes: ["Including WITH TIES."]
  sqlserver:
    - since: "11"
      status: supported
      notes: ["Requires ORDER BY (use ORDER BY (SELECT NULL) for no specific order); OFFSET is mandatory; no WITH TIES (use TOP (n) WITH TIES)."]
  postgresql:
    - since: "8.4"
      status: supported
      notes: ["FETCH ... WITH TIES since 13."]
  sqlite:
    - status: unsupported
      notes: ["Use LIMIT ... OFFSET."]
  manticore:
    - status: unsupported
      notes: ["Use LIMIT (query.limit-offset)."]
  sphinx:
    - status: unsupported
probes:
  - engines: [mysql, mariadb, postgresql, sqlserver, sqlite]
    statements: ["SELECT n FROM (SELECT 1 AS n) t ORDER BY n OFFSET 0 ROWS FETCH FIRST 1 ROWS ONLY"]
  - engines: [manticore]
    setup:
      - "CREATE TABLE probe_mt (title TEXT, v INT)"
    statements:
      - "SELECT id FROM probe_mt ORDER BY id ASC OFFSET 0 ROWS FETCH FIRST 1 ROWS ONLY"
    cleanup: ["DROP TABLE IF EXISTS probe_mt"]
  - engines: [sphinx]
    statements:
      - "SELECT id FROM probe_rt ORDER BY id ASC OFFSET 0 ROWS FETCH FIRST 1 ROWS ONLY"
