# yaml-language-server: $schema=../../schemas/capability.schema.json
id: query.window-functions
title: Window functions (OVER ...)
support:
  mysql:
    - until: "8.0"
      status: unsupported
    - since: "8.0"
      status: supported
  mariadb:
    - since: "10.2.0"
      status: supported
      notes: ["GROUPS frame units are not supported (verify)."]
  sqlserver:
    - since: "9"
      until: "11"
      status: partial
      notes: ["2005/2008: ranking functions and aggregates with PARTITION BY only, no ORDER BY in aggregate windows, no frames."]
    - since: "11"
      status: supported
      notes: ["Frames (ROWS/RANGE), LAG/LEAD, FIRST_VALUE etc. since 2012. Named WINDOW clause since 2022 (compatibility level 160)."]
  postgresql:
    - since: "8.4"
      status: supported
      notes: ["GROUPS frames and EXCLUDE since 11."]
  sqlite:
    - until: "3.25"
      status: unsupported
    - since: "3.25"
      status: supported
      notes: ["GROUPS frames, EXCLUDE and FILTER on window aggregates since 3.28."]
  manticore:
    - status: unsupported
      notes: ["Grouping is GROUP BY / GROUP n BY / WITHIN GROUP ORDER BY and FACET; no OVER()."]
probes:
  - engines: [mysql, mariadb, postgresql, sqlserver, sqlite]
    statements: ["SELECT ROW_NUMBER() OVER (ORDER BY n) AS rn FROM (SELECT 1 AS n) t"]
  - engines: [manticore]
    setup:
      - "CREATE TABLE probe_mt (title TEXT, v INT)"
    statements:
      - "SELECT id, ROW_NUMBER() OVER (ORDER BY id ASC) FROM probe_mt"
    cleanup: ["DROP TABLE IF EXISTS probe_mt"]
