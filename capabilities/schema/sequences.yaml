# yaml-language-server: $schema=../../schemas/capability.schema.json
id: schema.sequences
title: Sequence objects (CREATE SEQUENCE)
support:
  mysql:
    - status: unsupported
      notes: ["Only AUTO_INCREMENT columns."]
  mariadb:
    - since: "10.3"
      status: supported
      notes: ["A sequence is a special table (TABLE_TYPE = 'SEQUENCE'); NEXT VALUE FOR s / NEXTVAL(s)."]
  postgresql:
    - status: supported
      notes:
        - "SERIAL and IDENTITY columns are backed by sequences owned by the column (SERIAL / BIGSERIAL / SMALLSERIAL are expanded by the parser; they are not types in pg_type)."
        - "CREATE SEQUENCE options: AS smallint | integer | bigint (10+), INCREMENT, MINVALUE / MAXVALUE, START, CACHE, [NO] CYCLE, OWNED BY t.c; UNLOGGED / LOGGED since 15. ALTER SEQUENCE takes the same options plus RESTART [WITH n]; setval() / nextval() / currval() / lastval() work on any sequence."
  sqlserver:
    - since: "11"
      status: supported
      notes: ["NEXT VALUE FOR s; IDENTITY columns are not sequences."]
  sqlite:
    - status: unsupported
      notes: ["Only rowid / AUTOINCREMENT (sqlite_sequence table)."]
  manticore:
    - status: unsupported
      notes: ["Without an explicit id, INSERT generates a unique document id; there is no sequence object."]
  sphinx:
    - status: unsupported
      notes: ["No sequences and no generated ids: INSERT must give the id."]
probes:
  - engines: [mysql, mariadb, postgresql, sqlserver, sqlite]
    statements: ["CREATE SEQUENCE probe_seq START WITH 1 INCREMENT BY 1"]
    cleanup: ["DROP SEQUENCE IF EXISTS probe_seq"]
  - engines: [manticore]
    statements:
      - "CREATE SEQUENCE probe_seq START WITH 1 INCREMENT BY 1"
  - engines: [sphinx]
    statements:
      - "CREATE SEQUENCE probe_seq START WITH 1 INCREMENT BY 1"
