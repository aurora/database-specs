# yaml-language-server: $schema=../../schemas/capability.schema.json
id: transactions.transactional-ddl
title: DDL can be rolled back inside a transaction
description: >
  Decides whether a client (or an AI-generated script) can wrap schema changes in
  BEGIN ... ROLLBACK as a safety net.
support:
  mysql:
    - status: unsupported
      notes:
        - "DDL causes an implicit COMMIT before and after the statement (also commits pending DML!)."
        - "8.0 made DDL atomic (crash-safe per statement), which is not the same as transactional."
  mariadb:
    - status: unsupported
      notes:
        - "DDL causes an implicit COMMIT, as in MySQL. Atomic (crash-safe) DDL since 10.6 is not the same as transactional."
  postgresql:
    - status: supported
      notes:
        - "Exceptions: CREATE/DROP DATABASE, CREATE/DROP TABLESPACE, CREATE / DROP INDEX CONCURRENTLY and REINDEX CONCURRENTLY (observed 18.7: cannot run inside a transaction block), VACUUM, ALTER SYSTEM, and ALTER TYPE ... ADD VALUE before 12."
  sqlserver:
    - status: supported
      notes:
        - "Most DDL can be rolled back. Exceptions include CREATE/ALTER/DROP DATABASE, full-text catalog/index DDL and some ALTER DATABASE options."
        - "BEGIN alone starts a statement block, not a transaction: use BEGIN TRANSACTION."
  sqlite:
    - status: supported
      notes:
        - "All DDL is transactional. Exceptions: VACUUM and some PRAGMAs (e.g. journal_mode, foreign_keys) cannot run inside a transaction or are no-ops there."
  manticore:
    - status: unsupported
      notes: ["BEGIN / COMMIT / ROLLBACK only cover INSERT/REPLACE/DELETE on one real-time table; DDL takes effect immediately."]
      sources: [{ evidence: observed, notes: "manticore 32.1.3" }]
  sphinx:
    - until: "3"
      status: unsupported
      notes: ["No DDL that creates objects: indexes are declared in sphinx.conf; ALTER TABLE ADD / DROP COLUMN take effect immediately."]
      sources: [{ evidence: observed, notes: "Sphinx 2.2.11, 3.9.1" }]
    - since: "3"
      status: unsupported
      notes: ["CREATE TABLE (datadir mode) is not rolled back; BEGIN / COMMIT cover INSERT / REPLACE / DELETE on one RT index."]
      sources: [{ evidence: observed, notes: "Sphinx 2.2.11, 3.9.1" }]
probes:
  - name: rollback-create-table
    engines: [mysql, mariadb]
    statements:
      - "START TRANSACTION"
      - "CREATE TABLE probe_tx_ddl (id INT)"
      - "ROLLBACK"
    check: "SELECT COUNT(*) = 0 FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'probe_tx_ddl'"
    cleanup: ["DROP TABLE IF EXISTS probe_tx_ddl"]
  - name: rollback-create-table
    engines: [postgresql]
    statements:
      - "BEGIN"
      - "CREATE TABLE probe_tx_ddl (id INT)"
      - "ROLLBACK"
    check: "SELECT to_regclass('probe_tx_ddl') IS NULL"
    cleanup: ["DROP TABLE IF EXISTS probe_tx_ddl"]
  - name: rollback-create-table
    engines: [sqlserver]
    statements:
      - "BEGIN TRANSACTION"
      - "CREATE TABLE probe_tx_ddl (id INT)"
      - "ROLLBACK TRANSACTION"
    check: "SELECT CASE WHEN OBJECT_ID('probe_tx_ddl') IS NULL THEN 1 ELSE 0 END"
    cleanup: ["DROP TABLE IF EXISTS probe_tx_ddl"]
  - name: rollback-create-table
    engines: [sqlite]
    statements:
      - "BEGIN"
      - "CREATE TABLE probe_tx_ddl (id INT)"
      - "ROLLBACK"
    check: "SELECT COUNT(*) = 0 FROM sqlite_master WHERE name = 'probe_tx_ddl'"
    cleanup: ["DROP TABLE IF EXISTS probe_tx_ddl"]
  - name: rollback-create-table
    engines: [manticore]
    invert: true
    setup:
      - "BEGIN"
      - "CREATE TABLE probe_tx_ddl (v INT)"
      - "ROLLBACK"
    statements:
      - "SELECT id FROM probe_tx_ddl"
    cleanup: ["DROP TABLE IF EXISTS probe_tx_ddl"]
  - name: rollback-create-table
    engines: [sphinx]
    since: "3"
    invert: true
    setup:
      - "BEGIN"
      - "CREATE TABLE probe_tx_ddl (id bigint, title field indexed)"
      - "ROLLBACK"
    statements:
      - "SELECT id FROM probe_tx_ddl"
    cleanup:
      - "DROP TABLE probe_tx_ddl"
