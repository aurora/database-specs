# yaml-language-server: $schema=../schemas/engine.schema.json
id: manticore
name: Manticore Search
vendor: Manticore Software
description: >
  Full-text search engine with an SQL interface over the MySQL protocol (port 9306) and a JSON
  HTTP API (port 9308). Not a MySQL fork: its SQL dialect, data model (full-text fields vs
  attributes, real-time / plain / percolate / distributed tables) and catalog are its own.
extends: sphinx@2.2
protocols:
  - id: mysql
    default_port: 9306
    handshake:
      server_version: "The full VERSION() text (version, commit, build date, library versions) - not a MySQL-like 8.x version."
      capabilities: [CONNECT_WITH_DB, COMPRESS, PROTOCOL_41, SECURE_CONNECTION, MULTI_RESULTS, PLUGIN_AUTH, CONNECT_ATTRS, DEPRECATE_EOF]
      auth_plugins: [mysql_native_password]
      tls: "Only when searchd is configured with SSL certificates; the default container announces no CLIENT_SSL, so a client requiring TLS fails."
      notes:
        - "Without authentication configured, any user name and password are accepted."
        - "No CLIENT_MULTI_STATEMENTS: several statements per query only as SELECT ... FROM ...; SHOW META (the server's own multi-statement list of SELECT / SHOW / SET); 'SELECT 1; SELECT 2' is a syntax error."
        - "COM_STMT_PREPARE answers OK with the parameter count but no column metadata; executing prepared statements is not verified. Text-protocol queries must not contain '?'."
        - "MULTI_RESULTS is needed for SELECT ... FACET (one result set per facet)."
    type_mapping:
      - { type: bigint, code: 8, notes: ["Also the id column; signed 64 bit."] }
      - { type: int, code: 3, flags: [UNSIGNED], since: "27.1", notes: ["INT is unsigned 32 bit (DESCRIBE: uint): inserting -1 stores 4294967295."] }
      - { type: int, code: 3, until: "26", notes: ["25.0.0 sends no UNSIGNED flag although the value is unsigned."] }
      - { type: bool, code: 3, flags: [UNSIGNED], since: "27.1", value: "0 or 1" }
      - { type: bool, code: 3, until: "26", notes: ["25.0.0 sends no UNSIGNED flag although the value is unsigned."] }
      - { type: timestamp, code: 3, flags: [UNSIGNED], since: "27.1", value: "Unix time in seconds", notes: ["Not a TIMESTAMP (7) column: a client has to format it itself."] }
      - { type: timestamp, code: 3, until: "26", notes: ["25.0.0 sends no UNSIGNED flag although the value is unsigned."] }
      - { type: float, code: 4, notes: ["AVG() and other float expressions arrive as DOUBLE (5)."] }
      - { type: text, code: 254, binary: false, notes: ["Stored full-text fields; fields that are indexed but not stored do not appear in SELECT *."] }
      - { type: string, code: 254, binary: false }
      - { type: json, code: 254, binary: false, value: "JSON text; NULL when unset" }
      - { type: multi, code: 254, binary: false, value: "Comma-separated sorted integers, e.g. 1,2" }
      - { type: multi64, code: 254, binary: false, value: "Comma-separated sorted integers" }
      - { type: float_vector, code: 254, binary: false, value: "Comma-separated floats with 6 decimals, e.g. 0.500000,0.250000" }
    type_probe:
      setup: ["CREATE TABLE t_wire (a_text TEXT, a_string STRING, a_int INT, a_bigint BIGINT, a_float FLOAT, a_bool BOOL, a_timestamp TIMESTAMP, a_json JSON, a_multi MULTI, a_multi64 MULTI64, a_vector FLOAT_VECTOR knn_type='hnsw' knn_dims='2' hnsw_similarity='l2')"]
      query: "SELECT * FROM t_wire"
      columns: { id: bigint, a_text: text, a_string: string, a_int: int, a_bigint: bigint, a_float: float, a_bool: bool, a_timestamp: timestamp, a_json: json, a_multi: multi, a_multi64: multi64, a_vector: float_vector }
      cleanup: ["DROP TABLE IF EXISTS t_wire"]
    sources: [{ evidence: tested }]
lexical: manticore
catalogs: [SHOW / DESCRIBE statements]

identification:
  version_query: SELECT VERSION()
  version_pattern: '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+) [0-9a-f]+@'
  session_id_query: SELECT CONNECTION_ID()
  notes:
    - "VERSION() looks like '32.1.3 9d4cd4df2@26112010 (columnar 14.5.8 ...) (secondary ...) (knn ...)': version, commit, build date and the versions of the optional libraries."
    - "Over the mysql protocol it can be mistaken for MySQL: detect it by this version format (no '-MariaDB', commit hash after the version). DATABASE() always returns 'Manticore'."
    - "There is no authentication by default; user and password are ignored."
    - "information_schema (TABLES, COLUMNS, ...) is a small emulation for MySQL tools: only some columns are real, others return the string 'null'. Use SHOW TABLES / DESCRIBE (the introspection queries do)."
    - "CONNECTION_ID() matches the ConnID column of SHOW THREADS, which lists working threads only (not idle sessions), and the connid column of SELECT * FROM @@system.sessions, which lists every connection including idle ones (columns id, proto, state = query / net_idle, host, connid, killed, 'last cmd time', 'last cmd'; HTTP sessions too). The columns with spaces cannot be selected by name (backticks are a syntax error there): use SELECT *."
    - "@@system.<name> tables are not in the manual: @@system.sessions and @@system.threads work, but SELECT * FROM @@system.tables crashes 32.1.3 (signal 11, container gone; reproduced) - a client browsing system objects must never send it. system.sessions without @@ is 'unknown local table', SHOW TABLES FROM system returns nothing."
    - "32.1.3 with authentication disabled crashed (connection lost, container gone) on GRANT ... TO a user that does not exist - do not probe user management on a shared server."
    - "32.1.3 also crashes (signal 11) on the documented SELECT * FROM <table>.@table (table schema as a result set); use DESCRIBE."
    - "Statements accepted without effect (observed 32.1.3): CREATE DATABASE (SHOW DATABASES unchanged), SAVEPOINT (ROLLBACK TO SAVEPOINT is a syntax error), SET TRANSACTION ISOLATION LEVEL (no variable changes). LOCK TABLES t READ does lock: writes fail with 'table is locked' until UNLOCK TABLES."
    - "MySQL compatibility for GUI tools (Buddy / extra parser): SHOW COLUMNS FROM t [LIKE 'v%'] returns Field, Type, Null, Key, Default, Extra (Null always NO); the parser takes a db.t qualifier, but SHOW COLUMNS FROM Manticore.t fails ('no such table'). SHOW FULL TABLES returns Tables_in_Manticore, Table_type (BASE TABLE); SHOW SCHEMAS = SHOW DATABASES; SHOW OPEN TABLES returns Database, Table, In_use, Name_locked for every table."
    - "LIKE 'pattern' after SHOW TABLES, DESCRIBE t, SHOW COLUMNS FROM t, SHOW META and SHOW VARIABLES filters the output by name (% and _ wildcards); WHERE has no LIKE."
    - "SHOW CREATE TABLE on a missing table returns Buddy's generic 'You have an error in your query' instead of 'no such table' (DESCRIBE says 'no such table'): check existence with SHOW TABLES first."
    - "Table aliases (since 28.4; 27.1 and older: syntax error): FROM t AS a (or FROM t a) is accepted, but a. works only as a column prefix in the select list - WHERE a.v, ORDER BY a.v and JOIN ... ON a.id fail, and a JOIN table takes no alias (syntax error). Buddy's Alias plugin rewrites only some failing alias queries. Generate unaliased, table-qualified SQL."
    - "Built-in session functions: DATABASE() = 'Manticore', USER() / CURRENT_USER() = 'Usual' without authentication, VERSION(), CONNECTION_ID(), LAST_INSERT_ID() (names from the function table in src/sphinxexpr.cpp; DATABASE() and CURRENT_USER() are on no Functions page)."
    - "User variables are server-global lists of integers for IN filters: SET GLOBAL @ids = (1, 3), then WHERE id IN @ids; SET @ids = (...) without GLOBAL is a syntax error. SET TABLE t GLOBAL @v = (...) is the per-table form, for plain tables only (RT tables: 'unknown table in Set statement')."
    - "Buddy answers MySQL catalog statements that Manticore does not have with empty results (no error): SHOW INDEX / KEYS FROM t, SHOW FUNCTION STATUS, SHOW PROCEDURE STATUS, SHOW TRIGGERS, SHOW FULL PROCESSLIST, ...; SHOW ENGINES returns one invented MyISAM row. A MySQL-oriented client must not read them as 'no indexes / routines' - use SHOW TABLE t INDEXES (introspection.list-indexes). SHOW FULL COLUMNS FROM t fails ('error in your query'). SHOW ... results observed on 32.1.3; per the Buddy source (Select plugin) queries the C++ parser rejects may also be rewritten, keyed on the error text (not verified)."
    - "LIMIT -n is accepted by the parser but the result breaks the client (pymysql: decimal conversion error, the connection is unusable afterwards; observed 32.1.3) - never send a negative LIMIT."
    - "SHOW QUERIES lists running statements of all protocols (id, query, time, protocol, host) including Buddy's internal HTTP requests."
    - "KILL n on an idle connection (n = CONNECTION_ID() of that session) returns OK and sets killed = 1 in @@system.sessions, but the connection keeps working (SELECT 1 still succeeds; observed 32.1.3): KILL does not end a session. Whether it stops a running SELECT is untested."

versions:
  - series: "25"
    notes: ["Oldest line with an official image on Docker Hub (25.0.0); tested as tier: extended."]
  - series: "27"
  - series: "28"
  - series: "29"
  - series: "32"
    notes: ["Tested with 32.1.3 (official image, November 2026)."]

documentation:
  - title: Manticore Search manual
    url: https://manual.manticoresearch.com/

sources:
  - evidence: observed
    notes: Behaviour observed against manticoresearch/manticore 32.1.3.
