# yaml-language-server: $schema=../schemas/engine.schema.json
id: mariadb
name: MariaDB
vendor: MariaDB Foundation / MariaDB plc
description: Community fork of MySQL 5.5; diverged substantially since 10.0.
extends: mysql@5.5
protocols: [mysql]
lexical: mariadb
catalogs: [information_schema, performance_schema, mysql, sys]

identification:
  version_query: SELECT VERSION()
  version_pattern: '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-MariaDB'
  session_id_query: SELECT CONNECTION_ID()
  notes:
    - "VERSION() contains '-MariaDB' (e.g. 11.4.5-MariaDB-ubu2404). The handshake of 10.x/11.x may carry a '5.5.5-' prefix for old clients; strip it."
    - "Do not reuse MySQL version ranges: MariaDB 10.x is not comparable to MySQL 8.x."

versions:
  - series: "10.6"
    kind: lts
    released: 2021-07-06
    eol: 2026-07-06
  - series: "10.11"
    kind: lts
    released: 2023-02-16
    eol: 2028-02-16
  - series: "11.4"
    kind: lts
    released: 2024-05-29
    eol: 2029-05-29
  - series: "11.8"
    kind: lts
    released: 2025-06-04
    eol: 2028-06-04
  - series: "12"
    kind: stable
    notes: ["Rolling releases (12.0, 12.1, ...); the next LTS is cut from this line."]

documentation:
  - title: MariaDB Server Documentation
    url: https://mariadb.com/docs/server/

sources:
  - evidence: unverified
    notes: Release/EOL dates written from knowledge; verify against https://endoflife.date/mariadb
