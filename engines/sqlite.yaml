# yaml-language-server: $schema=../schemas/engine.schema.json
id: sqlite
name: SQLite
vendor: SQLite Consortium (public domain)
description: >
  Embedded database library; there is no server. The "version" is the version of the linked
  SQLite library, which is chosen by the application (statically linked) or the OS (shared
  libsqlite3), and compile-time options can enable or remove features.
protocols: [sqlite]
lexical: sqlite
catalogs: [sqlite_schema, pragma functions]

identification:
  version_query: SELECT sqlite_version()
  version_pattern: '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)'
  notes:
    - "sqlite3_libversion() returns the same without a query; sqlite3_compileoption_used() / PRAGMA compile_options show build options (e.g. ENABLE_MATH_FUNCTIONS, ENABLE_DBSTAT_VTAB, DQS)."
    - "All versions are 3.x; feature ranges use the minor version (3.35 = RETURNING)."
    - "Notable feature versions: 3.25 window functions / RENAME COLUMN, 3.31 generated columns, 3.35 RETURNING / DROP COLUMN, 3.37 STRICT tables / pragma table_list, 3.38 JSON built in / -> operators, 3.39 RIGHT and FULL JOIN, 3.45 JSONB."

versions:
  - series: "3.27"
    notes: ["Debian 10"]
  - series: "3.31"
    notes: ["Ubuntu 20.04"]
  - series: "3.34"
    notes: ["Debian 11, RHEL 9"]
  - series: "3.37"
    notes: ["Ubuntu 22.04"]
  - series: "3.40"
    notes: ["Debian 12"]
  - series: "3.45"
    notes: ["Ubuntu 24.04"]
  - series: "3.46"
    notes: ["Debian 13"]
  - series: "3.53"

documentation:
  - title: SQLite documentation
    url: https://sqlite.org/docs.html

sources:
  - evidence: observed
    notes: Debian versions read from the official python:*-slim images (3.27.2, 3.34.1, 3.40.1, 3.46.1); Ubuntu/RHEL versions unverified.
