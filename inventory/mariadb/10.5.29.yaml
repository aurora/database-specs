notes:
- 'Keywords: every name in sql/lex.h; group function = function-like word (COUNT, CAST, ...), group hint = word of the optimizer-hint
  parser only. information_schema.KEYWORDS (MySQL 8.0+) lists neither, so keyword lists leave them out.'
- 'func: items are the native functions resolved by name (func_array in sql/item_create.cc, func_array_geom in sql/item_geofunc.cc);
  functions with their own grammar (CAST, EXTRACT, aggregates, window functions, ...) are grammar items.'
- 'priv: items are the privilege names of SHOW PRIVILEGES (static and, since MySQL 8.0, dynamic privileges, which the grammar
  reads as identifiers); grammar items ending in (name) are words the parser actions compare an identifier with (ALGORITHM
  = INSTANT, FORMAT = TREE).'
- 'help: items are the topics of the server''s HELP tables (mysql.help_topic), which are generated from the reference manual
  - names, categories and links only. Some categories are misfiled upstream (MySQL: JSON functions under Spatial Functions
  / MBR Functions, 9.x vector functions under Window Functions): classify by topic name.'
- sql_yacc.yy is the default-mode branch of %ifdef MARIADB (sql_mode=ORACLE has its own generated grammar, 10.3 / 10.4 a separate
  sql_yacc_ora.yy) - Oracle mode is not inventoried.
- 'Optimizer hints (12.x) have a hand-written parser: their names come from sql/opt_hints_parser.h (keywords with group hint).'
- 'Data type plugins (INET4, INET6, UUID, ...) and the functions plugins register (INET6_ATON, UUID, UUID_v7, ...) are read
  from information_schema.PLUGINS of the running server (type: and func: items); they are not in sql/item_create.cc.'
- ALGORITHM / LOCK values of ALTER TABLE / CREATE INDEX are resolved in C++ (DEFAULT, COPY, INPLACE, NOCOPY, INSTANT; NONE,
  SHARED, EXCLUSIVE) and have no items; the create-index grammar lists them.
- 'sql_mode=ORACLE switches to a different grammar (PL/SQL forms, Oracle function overrides): highlighting and autocomplete
  for such sessions are not covered.'
- 'The HELP tables of 10.11.19 are a newer Knowledge Base export (category tree Contents / ...) that describes features 10.11
  does not have (VECTOR, UUID_v7, ...): its help: items are no evidence for 10.11.'
