# yaml-language-server: $schema=../schemas/lexical.schema.json
id: fulltext-query
description: >
  Tokens of the Sphinx / Manticore full-text query language (the MATCH() argument), used to
  tokenize syntax fulltext.manticore-query: double quotes delimit phrases, a backslash escapes
  operator characters. Not an engine's SQL lexical spec. To search user input literally, a client
  escapes these characters with a backslash: ! " $ ' ( ) - / < @ \ ^ | ~ (Manticore, observed on
  32.1.3; the manual says * cannot be escaped). The query is itself an SQL string literal, so each
  backslash is doubled once more there (MATCH('r\\&b')).

identifiers:
  quotes: []

strings:
  - kind: string
    open: '"'
    close: '"'
    escape: [backslash]
    notes: ["A phrase: \"exact words\", followed by ~N (proximity) or /N (quorum)."]

comments: []

statements:
  terminator: ""
  notes: ["One query per MATCH() argument; no statements."]

sources:
  - evidence: tested
    notes: "Through the examples of syntax fulltext.manticore-query on Manticore and Sphinx."
