# yaml-language-server: $schema=../../schemas/operation.schema.json
id: ddl.add-column
title: Add a column
parameters:
  - { name: table, kind: qualified-identifier }
  - { name: column, kind: identifier }
  - { name: column_definition, kind: sql-fragment, description: "Type and attributes, e.g. INT NOT NULL DEFAULT 0." }
  - { name: after, kind: identifier, description: "MySQL / MariaDB only: place the new column after this one (FIRST is also possible)." }
implementations:
  mysql:
    - status: supported
      template: "ALTER TABLE {{table}} ADD COLUMN {{column}} {{column_definition}}{{#after}} AFTER {{after}}{{/after}}"
      requires: [column_definition]
      transactional: false
      caveats:
        - "ALGORITHM=INSTANT since 8.0.12 (only as last column until 8.0.29); otherwise the table is rebuilt."
      sources: [{ evidence: tested }]
  mariadb:
    - status: supported
      template: "ALTER TABLE {{table}} ADD COLUMN {{column}} {{column_definition}}{{#after}} AFTER {{after}}{{/after}}"
      requires: [column_definition]
      transactional: false
      caveats: ["Instant ADD COLUMN since 10.3 (any position since 10.4)."]
      sources: [{ evidence: tested }]
  postgresql:
    - status: supported
      template: "ALTER TABLE {{table}} ADD COLUMN {{column}} {{column_definition}}"
      requires: [column_definition]
      transactional: true
      caveats:
        - "No column position; new columns are always last (reordering means recreating the table)."
        - "A non-volatile DEFAULT is instant since 11; a volatile one (random(), clock_timestamp()) rewrites the table."
      sources: [{ evidence: tested }]
  sqlserver:
    - status: supported
      template: "ALTER TABLE {{table}} ADD {{column}} {{column_definition}}"
      requires: [column_definition]
      transactional: true
      caveats: ["No COLUMN keyword and no position. A NOT NULL column needs a DEFAULT when the table has rows; the default becomes a named constraint (DF__...)."]
      sources: [{ evidence: tested }]
  sqlite:
    - status: supported
      template: "ALTER TABLE {{table}} ADD COLUMN {{column}} {{column_definition}}"
      requires: [column_definition]
      transactional: true
      caveats: ["Always appended. Not allowed: PRIMARY KEY / UNIQUE, a non-constant default (CURRENT_TIMESTAMP, expressions), NOT NULL without a non-NULL default, a STORED generated column."]
      sources: [{ evidence: tested }]
  manticore:
    - status: supported
      template: "ALTER TABLE {{table}} ADD COLUMN {{column}} {{column_definition}}"
      requires: [column_definition]
      transactional: false
      caveats:
        - "column_definition is a Manticore type (int, bigint, float, bool, timestamp, string, json, multi, multi64, text, float_vector, bit(n) ...) plus options; no NULL / DEFAULT / AFTER."
        - "New attributes read 0 / empty for existing documents. A new text field is only filled for documents inserted or replaced afterwards."
        - "Full-text fields are listed before attributes (DESCRIBE), whatever the order of ADD COLUMN."
      sources: [{ evidence: tested }]
  sphinx:
    - until: "3"
      status: supported
      template: "ALTER TABLE {{table}} ADD COLUMN {{column}} {{column_definition}}"
      requires: [column_definition]
      transactional: false
      caveats: ["Attributes only, types INTEGER | BIGINT | FLOAT | BOOL | MULTI | MULTI64 | JSON | STRING (not 'uint'); full-text fields cannot be added."]
      sources: [{ evidence: tested }]
    - since: "3"
      status: supported
      template: "ALTER TABLE {{table}} ADD COLUMN {{column}} {{column_definition}}"
      requires: [column_definition]
      transactional: false
      caveats: ["Attribute types as in DESCRIBE (uint, bigint, float, bool, string, json, uint_set, bigint_set) or the 2.x names (INTEGER ...)."]
      sources: [{ evidence: tested }]
