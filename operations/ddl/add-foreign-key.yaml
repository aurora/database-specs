# yaml-language-server: $schema=../../schemas/operation.schema.json
id: ddl.add-foreign-key
title: Add a foreign key
parameters:
  - { name: table, kind: qualified-identifier }
  - { name: constraint, kind: identifier }
  - { name: columns, kind: sql-fragment, description: "Quoted column list." }
  - { name: referenced_table, kind: qualified-identifier }
  - { name: referenced_columns, kind: sql-fragment }
  - { name: on_delete, kind: sql-fragment, description: "CASCADE, SET NULL, RESTRICT, NO ACTION, SET DEFAULT (optional)." }
  - { name: on_update, kind: sql-fragment }
implementations:
  mysql:
    - status: supported
      template: "ALTER TABLE {{table}} ADD CONSTRAINT {{constraint}} FOREIGN KEY ({{columns}}) REFERENCES {{referenced_table}} ({{referenced_columns}}){{#on_delete}} ON DELETE {{on_delete}}{{/on_delete}}{{#on_update}} ON UPDATE {{on_update}}{{/on_update}}"
      transactional: false
      caveats:
        - "InnoDB only; column types must match (including signedness and charset). An index on the columns is created automatically if missing."
        - "SET DEFAULT is parsed but rejected by InnoDB."
        - "MATCH FULL / PARTIAL / SIMPLE is parsed and silently dropped (SHOW CREATE TABLE shows no MATCH; observed 8.4.13, 9.7.4)."
        - "A column-level REFERENCES in CREATE / ALTER TABLE (pid INT REFERENCES p(id)) created no foreign key on 8.4.13 (parsed and ignored) but a real one named <table>_ibfk_<n> on 9.7.4; versions in between are untested. Use the table-level FOREIGN KEY form for older servers."
      sources: [{ evidence: tested }]
  mariadb:
    - status: supported
      template: "ALTER TABLE {{table}} ADD CONSTRAINT {{constraint}} FOREIGN KEY ({{columns}}) REFERENCES {{referenced_table}} ({{referenced_columns}}){{#on_delete}} ON DELETE {{on_delete}}{{/on_delete}}{{#on_update}} ON UPDATE {{on_update}}{{/on_update}}"
      transactional: false
      caveats:
        - "InnoDB only; column types must match. An index on the columns is created automatically if missing."
        - "Unlike MySQL before 9.x, a column-level REFERENCES in CREATE / ALTER TABLE creates a real foreign key (<table>_ibfk_<n>; observed 11.4.13, not checked on 10.3 / 10.4)."
        - "MATCH FULL / PARTIAL / SIMPLE is parsed and dropped (REFERENTIAL_CONSTRAINTS.MATCH_OPTION = NONE; observed 11.4.13)."
        - "MariaDB extension: ADD CONSTRAINT c FOREIGN KEY IF NOT EXISTS (col) ... does nothing when it exists."
      sources: [{ evidence: tested }]
  postgresql:
    - status: supported
      template: "ALTER TABLE {{table}} ADD CONSTRAINT {{constraint}} FOREIGN KEY ({{columns}}) REFERENCES {{referenced_table}} ({{referenced_columns}}){{#on_delete}} ON DELETE {{on_delete}}{{/on_delete}}{{#on_update}} ON UPDATE {{on_update}}{{/on_update}}"
      transactional: true
      caveats:
        - "No index is created on the referencing columns (add one for joins / cascading deletes)."
        - "Add NOT VALID to skip checking existing rows, then VALIDATE CONSTRAINT separately."
      sources: [{ evidence: tested }]
  sqlserver:
    - status: supported
      template: "ALTER TABLE {{table}} ADD CONSTRAINT {{constraint}} FOREIGN KEY ({{columns}}) REFERENCES {{referenced_table}} ({{referenced_columns}}){{#on_delete}} ON DELETE {{on_delete}}{{/on_delete}}{{#on_update}} ON UPDATE {{on_update}}{{/on_update}}"
      transactional: true
      caveats:
        - "No RESTRICT (use NO ACTION). Multiple cascade paths to the same table are rejected. No index is created on the referencing columns."
        - "WITH NOCHECK skips existing rows but leaves the constraint untrusted for the optimizer."
      sources: [{ evidence: tested }]
  sqlite:
    - status: unsupported
      notes: ["No ALTER for this: rebuild the table (see the emulated steps of ddl.change-column-type)."]
  manticore:
    - status: unsupported
      caveats: ["No foreign keys."]
      sources: [{ evidence: observed }]
  sphinx:
    - status: unsupported
      sources: [{ evidence: observed, notes: "Sphinx 2.2.11, 3.9.1" }]
