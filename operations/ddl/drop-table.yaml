# yaml-language-server: $schema=../../schemas/operation.schema.json
id: ddl.drop-table
title: Drop a table
parameters:
  - { name: table, kind: qualified-identifier }
  - { name: cascade, kind: boolean, description: "PostgreSQL: also drop dependent views and foreign keys." }
implementations:
  mysql:
    - status: supported
      template: "DROP TABLE {{table}}"
      transactional: false
      caveats:
        - "Fails if other tables reference it by foreign key (drop those first or disable foreign_key_checks). Views on it remain and become invalid."
        - "The statement also has DROP TEMPORARY TABLE, IF EXISTS (a note instead of an error) and several tables at once; CASCADE / RESTRICT are parsed and do nothing, so the cascade parameter has no effect."
      sources: [{ evidence: tested }]
  mariadb:
    - status: supported
      template: "DROP TABLE {{table}}"
      transactional: false
      caveats:
        - "As MySQL: fails while other tables reference it by foreign key; views on it become invalid."
        - "The statement also has DROP TEMPORARY TABLE, IF EXISTS, several tables at once and WAIT n / NOWAIT; CASCADE / RESTRICT are parsed and do nothing (the cascade parameter has no effect)."
      sources: [{ evidence: tested }]
  postgresql:
    - status: supported
      template: "DROP TABLE {{table}}{{#cascade}} CASCADE{{/cascade}}"
      transactional: true
      caveats: ["Without CASCADE it fails when views or foreign keys depend on the table."]
      sources: [{ evidence: tested }]
  sqlserver:
    - status: supported
      template: "DROP TABLE {{table}}"
      transactional: true
      caveats: ["Fails while foreign keys reference the table. Views on it remain (invalid); schema-bound views block the drop."]
      sources: [{ evidence: tested }]
  sqlite:
    - status: supported
      template: "DROP TABLE {{table}}"
      transactional: true
      caveats: ["With PRAGMA foreign_keys = ON an implicit DELETE checks referencing rows first."]
      sources: [{ evidence: tested }]
  manticore:
    - status: supported
      template: "DROP TABLE {{table}}"
      transactional: false
      caveats: ["DROP TABLE IF EXISTS is supported."]
      sources: [{ evidence: tested }]
  sphinx:
    - until: "3"
      status: unsupported
      caveats: ["Indexes are declared in sphinx.conf; remove them there and reload."]
      sources: [{ evidence: observed, notes: "Sphinx 2.2.11, 3.9.1" }]
    - since: "3"
      status: supported
      template: "DROP TABLE {{table}}"
      transactional: false
      caveats: ["Only in datadir mode, for indexes created by CREATE TABLE."]
      sources: [{ evidence: tested }]
