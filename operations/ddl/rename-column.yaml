# yaml-language-server: $schema=../../schemas/operation.schema.json
id: ddl.rename-column
title: Rename a column
parameters:
  - { name: table, kind: qualified-identifier }
  - { name: column, kind: identifier }
  - { name: new_name, kind: identifier }
  - { name: column_definition, kind: sql-fragment, description: "MySQL < 8.0 / MariaDB < 10.5.2: full column definition (CHANGE COLUMN)." }
  - { name: table_literal, kind: string-literal, description: "SQL Server: the quoted table name as a string ([dbo].[t]), for OBJECT_ID / sp_rename." }
  - { name: object_literal, kind: string-literal, description: "SQL Server: sp_rename object as a string, e.g. [dbo].[t].[old]." }
  - { name: new_name_literal, kind: string-literal, description: "SQL Server: the new name as a plain string (no brackets)." }
implementations:
  mysql:
    - until: "8.0"
      status: supported
      template: "ALTER TABLE {{table}} CHANGE COLUMN {{column}} {{new_name}} {{column_definition}}"
      requires: [column_definition]
      transactional: false
      caveats: ["CHANGE replaces the full definition (see ddl.change-column-type): repeat NOT NULL, DEFAULT, COMMENT, ..."]
      sources: [{ evidence: tested }]
    - since: "8.0"
      status: supported
      template: "ALTER TABLE {{table}} RENAME COLUMN {{column}} TO {{new_name}}"
      transactional: false
      caveats: ["Views and routines referencing the old name are not updated."]
      sources: [{ evidence: tested }]
  mariadb:
    - until: "10.5.2"
      status: supported
      template: "ALTER TABLE {{table}} CHANGE COLUMN {{column}} {{new_name}} {{column_definition}}"
      requires: [column_definition]
      transactional: false
    - since: "10.5.2"
      status: supported
      template: "ALTER TABLE {{table}} RENAME COLUMN {{column}} TO {{new_name}}"
      transactional: false
      caveats: ["Views and routines referencing the old name are not updated."]
      sources: [{ evidence: tested }]
  postgresql:
    - status: supported
      template: "ALTER TABLE {{table}} RENAME COLUMN {{column}} TO {{new_name}}"
      transactional: true
      caveats: ["Views, constraints and indexes follow the rename (they reference columns by number); function bodies do not."]
      sources: [{ evidence: tested }]
  sqlserver:
    - status: supported
      template: "EXEC sp_rename {{object_literal}}, {{new_name_literal}}, 'COLUMN'"
      requires: [object_literal, new_name_literal]
      transactional: true
      caveats:
        - "sp_rename takes strings: the object as a (bracket-quoted) multi-part name, the new name WITHOUT brackets (brackets would become part of the name)."
        - "Returns a warning that renaming can break scripts and stored procedures; views / routines referencing the column are not updated."
      sources: [{ evidence: tested }]
  sqlite:
    - since: "3.25"
      status: supported
      template: "ALTER TABLE {{table}} RENAME COLUMN {{column}} TO {{new_name}}"
      transactional: true
      caveats: ["References in indexes, triggers and views are rewritten too."]
      sources: [{ evidence: tested }]
  manticore:
    - status: unsupported
      caveats: ["No RENAME COLUMN (syntax error): recreate the table and re-insert the documents."]
      sources: [{ evidence: observed, notes: "manticore 32.1.3" }]
  sphinx:
    - status: unsupported
      sources: [{ evidence: observed, notes: "Sphinx 2.2.11, 3.9.1" }]
