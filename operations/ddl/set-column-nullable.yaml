# yaml-language-server: $schema=../../schemas/operation.schema.json
id: ddl.set-column-nullable
title: Allow or forbid NULL in a column
parameters:
  - { name: table, kind: qualified-identifier }
  - { name: column, kind: identifier }
  - { name: nullable, kind: boolean }
  - { name: column_definition, kind: sql-fragment, description: "MySQL / MariaDB: full new definition incl. NULL / NOT NULL." }
implementations:
  mysql:
    - status: supported
      template: "ALTER TABLE {{table}} MODIFY COLUMN {{column}} {{column_definition}}"
      requires: [column_definition]
      transactional: false
      caveats: ["No dedicated syntax: MODIFY with the full definition (attributes not repeated are lost, see ddl.change-column-type). NOT NULL fails on existing NULLs in strict mode."]
      sources: [{ evidence: tested }]
  mariadb:
    - status: supported
      template: "ALTER TABLE {{table}} MODIFY COLUMN {{column}} {{column_definition}}"
      requires: [column_definition]
      transactional: false
      caveats: ["As MySQL."]
      sources: [{ evidence: tested }]
  postgresql:
    - status: supported
      template: "ALTER TABLE {{table}} ALTER COLUMN {{column}} {{#nullable}}DROP{{/nullable}}{{^nullable}}SET{{/nullable}} NOT NULL"
      transactional: true
      caveats: ["SET NOT NULL scans the table (fails on NULLs). Primary key columns cannot DROP NOT NULL."]
      sources: [{ evidence: tested }]
  sqlserver:
    - status: supported
      template: "ALTER TABLE {{table}} ALTER COLUMN {{column}} {{column_definition}}"
      requires: [column_definition]
      transactional: true
      caveats: ["column_definition is the type (with COLLATE) plus NULL / NOT NULL; the default constraint is kept. Fails if an index or constraint depends on the column."]
      sources: [{ evidence: tested }]
  sqlite:
    - status: unsupported
      notes: ["No ALTER for this: rebuild the table (see the emulated steps of ddl.change-column-type)."]
  manticore:
    - status: unsupported
      caveats: ["No NULL / NOT NULL in column definitions (attributes are never NULL except json)."]
      sources: [{ evidence: observed, notes: "CREATE TABLE ... NOT NULL is a syntax error (32.1.3)" }]
