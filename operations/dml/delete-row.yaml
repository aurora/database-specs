# yaml-language-server: $schema=../../schemas/operation.schema.json
id: dml.delete-row
title: Delete one row from the data grid
parameters:
  - { name: table, kind: qualified-identifier }
  - name: key_predicate
    kind: sql-fragment
    description: >
      Identifies the row: primary key / unique key columns (id = ?). Without a unique key, all
      original column values; use IS NULL for NULLs and avoid comparing approximate types (FLOAT).
  - name: no_unique_key
    kind: boolean
    description: The table has no primary / unique key - limit the statement to one row.
implementations:
  mysql:
    - status: supported
      template: "DELETE FROM {{table}} WHERE {{key_predicate}}{{#no_unique_key}} LIMIT 1{{/no_unique_key}}"
      caveats: ["Check the affected row count (0 = already gone)."]
      sources: [{ evidence: tested }]
  mariadb:
    - status: supported
      template: "DELETE FROM {{table}} WHERE {{key_predicate}}{{#no_unique_key}} LIMIT 1{{/no_unique_key}}"
      sources: [{ evidence: tested }]
  postgresql:
    - status: supported
      template: "DELETE FROM {{table}} WHERE {{#no_unique_key}}ctid = (SELECT ctid FROM {{table}} WHERE {{key_predicate}} LIMIT 1){{/no_unique_key}}{{^no_unique_key}}{{key_predicate}}{{/no_unique_key}}"
      caveats: ["See dml.update-row for ctid."]
      sources: [{ evidence: tested }]
  sqlserver:
    - status: supported
      template: "DELETE {{#no_unique_key}}TOP (1) {{/no_unique_key}}FROM {{table}} WHERE {{key_predicate}}"
      sources: [{ evidence: tested }]
  sqlite:
    - status: supported
      template: "DELETE FROM {{table}} WHERE {{#no_unique_key}}rowid = (SELECT rowid FROM {{table}} WHERE {{key_predicate}} LIMIT 1){{/no_unique_key}}{{^no_unique_key}}{{key_predicate}}{{/no_unique_key}}"
      caveats: ["See dml.update-row for rowid."]
      sources: [{ evidence: tested }]
  manticore:
    - status: supported
      template: "DELETE FROM {{table}} WHERE {{key_predicate}}"
      caveats: ["Use id = ? as key_predicate (always unique); there is no DELETE ... LIMIT."]
      sources: [{ evidence: tested }]
  sphinx:
    - status: supported
      template: "DELETE FROM {{table}} WHERE {{key_predicate}}"
      caveats: ["Use id = ? (always unique)."]
      sources: [{ evidence: tested }]
