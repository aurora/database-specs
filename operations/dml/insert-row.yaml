# yaml-language-server: $schema=../../schemas/operation.schema.json
id: dml.insert-row
title: Insert a row from the data grid
parameters:
  - { name: table, kind: qualified-identifier }
  - { name: columns, kind: sql-fragment, description: "Quoted column list." }
  - { name: values, kind: sql-fragment, description: "Matching value list, normally placeholders." }
  - { name: returning, kind: sql-fragment, description: "Columns to return (generated keys, defaults) where supported." }
implementations:
  mysql:
    - status: supported
      template: "INSERT INTO {{table}} ({{columns}}) VALUES ({{values}})"
      caveats: ["No RETURNING: read the generated AUTO_INCREMENT value with LAST_INSERT_ID() / mysql_insert_id(), other defaults by re-reading the row."]
      sources: [{ evidence: tested }]
  mariadb:
    - status: supported
      template: "INSERT INTO {{table}} ({{columns}}) VALUES ({{values}}){{#returning}} RETURNING {{returning}}{{/returning}}"
      caveats: ["RETURNING since 10.5 (capability dml.returning)."]
      sources: [{ evidence: tested }]
  postgresql:
    - status: supported
      template: "INSERT INTO {{table}} ({{columns}}) VALUES ({{values}}){{#returning}} RETURNING {{returning}}{{/returning}}"
      sources: [{ evidence: tested }]
  sqlserver:
    - status: supported
      template: "INSERT INTO {{table}} ({{columns}}){{#returning}} OUTPUT {{returning}}{{/returning}} VALUES ({{values}})"
      caveats:
        - "returning uses the OUTPUT clause: inserted.id, inserted.created_at. OUTPUT without INTO fails on tables with enabled triggers; then use SCOPE_IDENTITY()."
        - "Explicit values for an IDENTITY column need SET IDENTITY_INSERT t ON."
      sources: [{ evidence: tested }]
  sqlite:
    - status: supported
      template: "INSERT INTO {{table}} ({{columns}}) VALUES ({{values}}){{#returning}} RETURNING {{returning}}{{/returning}}"
      caveats: ["RETURNING since 3.35; before, read sqlite3_last_insert_rowid() / last_insert_rowid()."]
      sources: [{ evidence: tested }]
  manticore:
    - status: supported
      template: "INSERT INTO {{table}} ({{columns}}) VALUES ({{values}})"
      caveats:
        - "Without an id column the server generates a unique 64-bit id; SELECT LAST_INSERT_ID() returns it (as a string)."
        - "Inserting an existing id fails (duplicate id); REPLACE INTO replaces the whole document (dml.upsert)."
        - "No RETURNING and no server-side placeholders: values must be inlined as escaped literals (client-side prepared statements)."
      sources: [{ evidence: tested }]
