# yaml-language-server: $schema=../../schemas/operation.schema.json
id: dml.update-row
title: Update one row from the data grid
parameters:
  - { name: table, kind: qualified-identifier }
  - { name: assignments, kind: sql-fragment, description: "col = ?, col2 = ?" }
  - name: key_predicate
    kind: sql-fragment
    description: >
      Identifies the row: primary key / unique key columns (id = ?). Without a unique key, all
      original column values; use IS NULL for NULLs and avoid comparing approximate types (FLOAT).
  - name: no_unique_key
    kind: boolean
    description: The table has no primary / unique key - limit the statement to one row.
implementations:
  mysql:
    - status: supported
      template: "UPDATE {{table}} SET {{assignments}} WHERE {{key_predicate}}{{#no_unique_key}} LIMIT 1{{/no_unique_key}}"
      caveats:
        - "Check the affected row count: 0 means the row was changed or deleted meanwhile. MySQL counts only rows actually changed (CLIENT_FOUND_ROWS changes that)."
        - "LIMIT 1 for tables without a unique key: identical duplicate rows are indistinguishable anyway."
      sources: [{ evidence: tested }]
  mariadb:
    - status: supported
      template: "UPDATE {{table}} SET {{assignments}} WHERE {{key_predicate}}{{#no_unique_key}} LIMIT 1{{/no_unique_key}}"
      caveats: ["As MySQL."]
      sources: [{ evidence: tested }]
  postgresql:
    - status: supported
      template: "UPDATE {{table}} SET {{assignments}} WHERE {{#no_unique_key}}ctid = (SELECT ctid FROM {{table}} WHERE {{key_predicate}} LIMIT 1){{/no_unique_key}}{{^no_unique_key}}{{key_predicate}}{{/no_unique_key}}"
      caveats:
        - "No UPDATE ... LIMIT: tables without a unique key are addressed by ctid (physical row id). A ctid changes with every update and VACUUM FULL; on partitioned tables it is only unique together with tableoid."
        - "Alternative: select ctid with the grid rows and use WHERE ctid = ? directly."
      sources: [{ evidence: tested }]
  sqlserver:
    - status: supported
      template: "UPDATE {{#no_unique_key}}TOP (1) {{/no_unique_key}}{{table}} SET {{assignments}} WHERE {{key_predicate}}"
      caveats: ["TOP (1) for tables without a unique key. The affected row count may include rows changed by triggers unless SET NOCOUNT is used inside them."]
      sources: [{ evidence: tested }]
  sqlite:
    - status: supported
      template: "UPDATE {{table}} SET {{assignments}} WHERE {{#no_unique_key}}rowid = (SELECT rowid FROM {{table}} WHERE {{key_predicate}} LIMIT 1){{/no_unique_key}}{{^no_unique_key}}{{key_predicate}}{{/no_unique_key}}"
      caveats: ["Rowid tables can always be addressed by rowid (select it with the grid rows: stable as long as the row lives, unless VACUUM renumbers an implicit rowid). WITHOUT ROWID tables always have a primary key. UPDATE ... LIMIT only with SQLITE_ENABLE_UPDATE_DELETE_LIMIT."]
      sources: [{ evidence: tested }]
  manticore:
    - status: partial
      template: "UPDATE {{table}} SET {{assignments}} WHERE {{key_predicate}}"
      caveats:
        - "Only attributes can be updated; a full-text field (TEXT) gives 'can not be updated (full-text field)'. To change one, REPLACE INTO the whole document (all columns) or REPLACE INTO t SET col = ... WHERE id = n."
        - "The document id is always unique: use id = ? as key_predicate; no_unique_key never applies (there is no UPDATE ... LIMIT)."
      sources: [{ evidence: tested }]
  sphinx:
    - until: "3"
      status: partial
      template: "UPDATE {{table}} SET {{assignments}} WHERE {{key_predicate}}"
      caveats: ["Only numeric / MVA / JSON attributes; string attributes and full-text fields cannot be updated (syntax error) - use REPLACE with the whole document."]
      sources: [{ evidence: tested }]
    - since: "3"
      status: partial
      template: "UPDATE {{table}} SET {{assignments}} WHERE {{key_predicate}}"
      caveats: ["Attributes including strings; full-text fields cannot be updated ('attribute not found') - use REPLACE."]
      sources: [{ evidence: tested }]
