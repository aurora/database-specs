# yaml-language-server: $schema=../../schemas/operation.schema.json
id: introspection.table-ddl
title: Reconstruct the CREATE TABLE statement of a table
description: >
  Returns one text value (result_column) with SQL that recreates the table. Tested by round
  trip: drop the table, run the returned SQL, compare columns, indexes and constraints.
parameters:
  - { name: table, kind: qualified-identifier, description: "MySQL / MariaDB." }
  - { name: schema_name, kind: string-literal, description: "PostgreSQL." }
  - { name: table_name, kind: string-literal, description: "PostgreSQL." }

implementations:
  mysql:
    - status: supported
      template: "SHOW CREATE TABLE {{table}}"
      requires: [table]
      result_column: 2
      caveats:
        - "Contains the current AUTO_INCREMENT=n counter and the table options (ENGINE, CHARSET, COLLATE, ROW_FORMAT); strip AUTO_INCREMENT when copying a structure."
        - "The table name is not schema-qualified; foreign keys reference other tables, which must exist when the statement runs (or use SET FOREIGN_KEY_CHECKS=0)."
        - "Output follows sql_mode (e.g. ANSI_QUOTES switches to double quotes)."
      sources: [{ evidence: tested }]
  mariadb:
    - status: supported
      template: "SHOW CREATE TABLE {{table}}"
      requires: [table]
      result_column: 2
      caveats:
        - "As MySQL. CHECK constraints and system versioning are included."
      sources: [{ evidence: tested }]
  postgresql:
    - status: supported
      requires: [schema_name, table_name]
      result_column: 1
      template: |
        SELECT
            'CREATE ' || CASE WHEN c.relpersistence = 'u' THEN 'UNLOGGED ' ELSE '' END
            || 'TABLE ' || quote_ident(n.nspname) || '.' || quote_ident(c.relname) || ' (' || E'\n'
            || array_to_string(
                 array(
                   SELECT '    ' || quote_ident(a.attname) || ' ' || format_type(a.atttypid, a.atttypmod)
                       || CASE WHEN a.attcollation <> 0 AND a.attcollation <> ty.typcollation
                               THEN ' COLLATE ' || quote_ident(co.collname) ELSE '' END
                       || CASE a.attidentity WHEN 'a' THEN ' GENERATED ALWAYS AS IDENTITY'
                                             WHEN 'd' THEN ' GENERATED BY DEFAULT AS IDENTITY' ELSE '' END
                       || CASE WHEN a.attgenerated = 's' THEN ' GENERATED ALWAYS AS (' || pg_get_expr(d.adbin, d.adrelid) || ') STORED'
                               WHEN a.attgenerated = 'v' THEN ' GENERATED ALWAYS AS (' || pg_get_expr(d.adbin, d.adrelid) || ') VIRTUAL'
                               WHEN d.adbin IS NOT NULL THEN ' DEFAULT ' || pg_get_expr(d.adbin, d.adrelid)
                               ELSE '' END
                       || CASE WHEN a.attnotnull THEN ' NOT NULL' ELSE '' END
                   FROM pg_catalog.pg_attribute a
                   JOIN pg_catalog.pg_type ty ON ty.oid = a.atttypid
                   LEFT JOIN pg_catalog.pg_attrdef d ON d.adrelid = a.attrelid AND d.adnum = a.attnum
                   LEFT JOIN pg_catalog.pg_collation co ON co.oid = a.attcollation
                   WHERE a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped
                   ORDER BY a.attnum)
                 || array(
                   SELECT '    CONSTRAINT ' || quote_ident(con.conname) || ' ' || pg_get_constraintdef(con.oid, true)
                   FROM pg_catalog.pg_constraint con
                   WHERE con.conrelid = c.oid AND con.contype IN ('p', 'u', 'c', 'x', 'f')
                   ORDER BY position(con.contype IN 'pucxf'), con.conname),
                 ',' || E'\n')
            || E'\n' || ')'
            || CASE WHEN c.relkind = 'p' THEN ' PARTITION BY ' || pg_get_partkeydef(c.oid) ELSE '' END
            || CASE WHEN c.reloptions IS NOT NULL THEN ' WITH (' || array_to_string(c.reloptions, ', ') || ')' ELSE '' END
            || ';'
            || coalesce((SELECT string_agg(E'\n' || pg_get_indexdef(i.indexrelid) || ';', '' ORDER BY ic.relname)
                           FROM pg_catalog.pg_index i
                           JOIN pg_catalog.pg_class ic ON ic.oid = i.indexrelid
                          WHERE i.indrelid = c.oid
                            AND NOT EXISTS (SELECT 1 FROM pg_catalog.pg_constraint x WHERE x.conindid = i.indexrelid)), '')
            || coalesce(E'\nCOMMENT ON TABLE ' || quote_ident(n.nspname) || '.' || quote_ident(c.relname)
                        || ' IS ' || quote_literal(obj_description(c.oid, 'pg_class')) || ';', '')
            || coalesce((SELECT string_agg(E'\nCOMMENT ON COLUMN ' || quote_ident(n.nspname) || '.' || quote_ident(c.relname)
                                           || '.' || quote_ident(a.attname) || ' IS '
                                           || quote_literal(col_description(c.oid, a.attnum)) || ';', '' ORDER BY a.attnum)
                           FROM pg_catalog.pg_attribute a
                          WHERE a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped
                            AND col_description(c.oid, a.attnum) IS NOT NULL), '')
            AS ddl
        FROM pg_catalog.pg_class c
        JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
        WHERE n.nspname = {{schema_name}} AND c.relname = {{table_name}} AND c.relkind IN ('r', 'p')
      caveats:
        - "There is no SHOW CREATE TABLE; the statement is assembled from the catalog (columns, collations, identity, generated columns, defaults, NOT NULL, constraints incl. foreign keys, partition key, storage options, non-constraint indexes, comments)."
        - "Not included: identity / sequence options (START, INCREMENT), partitions (CREATE TABLE ... PARTITION OF), inheritance, tablespace, triggers, row-level security, grants, ownership."
        - "Foreign keys are part of CREATE TABLE: referenced tables must exist first (or move FKs to ALTER TABLE when scripting several tables)."
        - "The output is multiple statements separated by ';'."
      sources: [{ evidence: tested }]
