# yaml-language-server: $schema=../../schemas/operation.schema.json
id: introspection.table-ddl
title: Reconstruct the CREATE TABLE statement of a table
description: >
  Returns one text value (result_column) with SQL that recreates the table. Tested by round
  trip: drop the table, run the returned SQL, compare columns, indexes and constraints.
parameters:
  - { name: table, kind: qualified-identifier, description: "MySQL / MariaDB." }
  - { name: schema_name, kind: string-literal, description: "PostgreSQL." }
  - { name: table_name, kind: string-literal, description: "PostgreSQL." }

  - { name: schema, kind: identifier, description: "SQLite: schema (main, temp or an attached database)." }
implementations:
  mysql:
    - status: supported
      template: "SHOW CREATE TABLE {{table}}"
      requires: [table]
      result_column: 2
      caveats:
        - "Contains the current AUTO_INCREMENT=n counter and the table options (ENGINE, CHARSET, COLLATE, ROW_FORMAT); strip AUTO_INCREMENT when copying a structure."
        - "The table name is not schema-qualified; foreign keys reference other tables, which must exist when the statement runs (or use SET FOREIGN_KEY_CHECKS=0)."
        - "Output follows sql_mode (e.g. ANSI_QUOTES switches to double quotes)."
      sources: [{ evidence: tested }]
  mariadb:
    - status: supported
      template: "SHOW CREATE TABLE {{table}}"
      requires: [table]
      result_column: 2
      caveats:
        - "As MySQL. CHECK constraints and system versioning are included."
      sources: [{ evidence: tested }]
  postgresql:
    - status: supported
      requires: [schema_name, table_name]
      result_column: 1
      template: |
        SELECT
            'CREATE ' || CASE WHEN c.relpersistence = 'u' THEN 'UNLOGGED ' ELSE '' END
            || 'TABLE ' || quote_ident(n.nspname) || '.' || quote_ident(c.relname) || ' (' || E'\n'
            || array_to_string(
                 array(
                   SELECT '    ' || quote_ident(a.attname) || ' ' || format_type(a.atttypid, a.atttypmod)
                       || CASE WHEN a.attcollation <> 0 AND a.attcollation <> ty.typcollation
                               THEN ' COLLATE ' || quote_ident(co.collname) ELSE '' END
                       || CASE a.attidentity WHEN 'a' THEN ' GENERATED ALWAYS AS IDENTITY'
                                             WHEN 'd' THEN ' GENERATED BY DEFAULT AS IDENTITY' ELSE '' END
                       || CASE WHEN a.attgenerated = 's' THEN ' GENERATED ALWAYS AS (' || pg_get_expr(d.adbin, d.adrelid) || ') STORED'
                               WHEN a.attgenerated = 'v' THEN ' GENERATED ALWAYS AS (' || pg_get_expr(d.adbin, d.adrelid) || ') VIRTUAL'
                               WHEN d.adbin IS NOT NULL THEN ' DEFAULT ' || pg_get_expr(d.adbin, d.adrelid)
                               ELSE '' END
                       || CASE WHEN a.attnotnull THEN ' NOT NULL' ELSE '' END
                   FROM pg_catalog.pg_attribute a
                   JOIN pg_catalog.pg_type ty ON ty.oid = a.atttypid
                   LEFT JOIN pg_catalog.pg_attrdef d ON d.adrelid = a.attrelid AND d.adnum = a.attnum
                   LEFT JOIN pg_catalog.pg_collation co ON co.oid = a.attcollation
                   WHERE a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped
                   ORDER BY a.attnum)
                 || array(
                   SELECT '    CONSTRAINT ' || quote_ident(con.conname) || ' ' || pg_get_constraintdef(con.oid, true)
                   FROM pg_catalog.pg_constraint con
                   WHERE con.conrelid = c.oid AND con.contype IN ('p', 'u', 'c', 'x', 'f')
                   ORDER BY position(con.contype IN 'pucxf'), con.conname),
                 ',' || E'\n')
            || E'\n' || ')'
            || CASE WHEN c.relkind = 'p' THEN ' PARTITION BY ' || pg_get_partkeydef(c.oid) ELSE '' END
            || CASE WHEN c.reloptions IS NOT NULL THEN ' WITH (' || array_to_string(c.reloptions, ', ') || ')' ELSE '' END
            || ';'
            || coalesce((SELECT string_agg(E'\n' || pg_get_indexdef(i.indexrelid) || ';', '' ORDER BY ic.relname)
                           FROM pg_catalog.pg_index i
                           JOIN pg_catalog.pg_class ic ON ic.oid = i.indexrelid
                          WHERE i.indrelid = c.oid
                            AND NOT EXISTS (SELECT 1 FROM pg_catalog.pg_constraint x WHERE x.conindid = i.indexrelid)), '')
            || coalesce(E'\nCOMMENT ON TABLE ' || quote_ident(n.nspname) || '.' || quote_ident(c.relname)
                        || ' IS ' || quote_literal(obj_description(c.oid, 'pg_class')) || ';', '')
            || coalesce((SELECT string_agg(E'\nCOMMENT ON COLUMN ' || quote_ident(n.nspname) || '.' || quote_ident(c.relname)
                                           || '.' || quote_ident(a.attname) || ' IS '
                                           || quote_literal(col_description(c.oid, a.attnum)) || ';', '' ORDER BY a.attnum)
                           FROM pg_catalog.pg_attribute a
                          WHERE a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped
                            AND col_description(c.oid, a.attnum) IS NOT NULL), '')
            AS ddl
        FROM pg_catalog.pg_class c
        JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
        WHERE n.nspname = {{schema_name}} AND c.relname = {{table_name}} AND c.relkind IN ('r', 'p')
      caveats:
        - "There is no SHOW CREATE TABLE; the statement is assembled from the catalog (columns, collations, identity, generated columns, defaults, NOT NULL, constraints incl. foreign keys, partition key, storage options, non-constraint indexes, comments)."
        - "Not included: identity / sequence options (START, INCREMENT), partitions (CREATE TABLE ... PARTITION OF), inheritance, tablespace, triggers, row-level security, grants, ownership."
        - "Foreign keys are part of CREATE TABLE: referenced tables must exist first (or move FKs to ALTER TABLE when scripting several tables)."
        - "The output is multiple statements separated by ';'."
      sources: [{ evidence: tested }]
  sqlserver:
    - status: supported
      requires: [schema_name, table_name]
      result_column: 1
      template: |
        WITH tbl AS (
            SELECT t.object_id, s.name AS sch, t.name AS tab
            FROM sys.tables t JOIN sys.schemas s ON s.schema_id = t.schema_id
            WHERE s.name = {{schema_name}} AND t.name = {{table_name}}
        ), lines AS (
            SELECT 1 AS grp, c.column_id AS ord, CAST('    ' + QUOTENAME(c.name) + ' ' +
                CASE WHEN c.is_computed = 1
                     THEN 'AS ' + cc.definition + CASE WHEN cc.is_persisted = 1 THEN ' PERSISTED' ELSE '' END
                     ELSE
                       CASE WHEN ty.is_user_defined = 1 THEN QUOTENAME(SCHEMA_NAME(ty.schema_id)) + '.' + QUOTENAME(ty.name)
                            WHEN ty.name IN ('varchar', 'char', 'varbinary', 'binary')
                                 THEN ty.name + '(' + CASE WHEN c.max_length = -1 THEN 'max' ELSE CAST(c.max_length AS varchar(10)) END + ')'
                            WHEN ty.name IN ('nvarchar', 'nchar')
                                 THEN ty.name + '(' + CASE WHEN c.max_length = -1 THEN 'max' ELSE CAST(c.max_length / 2 AS varchar(10)) END + ')'
                            WHEN ty.name IN ('decimal', 'numeric')
                                 THEN ty.name + '(' + CAST(c.precision AS varchar(10)) + ',' + CAST(c.scale AS varchar(10)) + ')'
                            WHEN ty.name IN ('datetime2', 'time', 'datetimeoffset')
                                 THEN ty.name + '(' + CAST(c.scale AS varchar(10)) + ')'
                            WHEN ty.name = 'float' AND c.precision <> 53 THEN 'float(' + CAST(c.precision AS varchar(10)) + ')'
                            ELSE ty.name END
                       + CASE WHEN c.collation_name IS NOT NULL THEN ' COLLATE ' + c.collation_name ELSE '' END
                       + CASE WHEN ic.object_id IS NOT NULL
                              THEN ' IDENTITY(' + CAST(ic.seed_value AS varchar(40)) + ',' + CAST(ic.increment_value AS varchar(40)) + ')'
                              ELSE '' END
                       + CASE WHEN c.is_nullable = 1 THEN ' NULL' ELSE ' NOT NULL' END
                       + CASE WHEN dc.object_id IS NOT NULL
                              THEN ' CONSTRAINT ' + QUOTENAME(dc.name) + ' DEFAULT ' + dc.definition ELSE '' END
                END AS nvarchar(max)) AS txt
            FROM tbl
            JOIN sys.columns c ON c.object_id = tbl.object_id
            JOIN sys.types ty  ON ty.user_type_id = c.user_type_id
            LEFT JOIN sys.computed_columns cc   ON cc.object_id = c.object_id AND cc.column_id = c.column_id
            LEFT JOIN sys.identity_columns ic   ON ic.object_id = c.object_id AND ic.column_id = c.column_id
            LEFT JOIN sys.default_constraints dc ON dc.object_id = c.default_object_id
            UNION ALL
            SELECT 2, ROW_NUMBER() OVER (ORDER BY CASE kc.type WHEN 'PK' THEN 0 ELSE 1 END, kc.name),
                CAST('    CONSTRAINT ' + QUOTENAME(kc.name) + CASE kc.type WHEN 'PK' THEN ' PRIMARY KEY ' ELSE ' UNIQUE ' END
                     + CASE i.type WHEN 1 THEN 'CLUSTERED' ELSE 'NONCLUSTERED' END + ' ('
                     + (SELECT STRING_AGG(CAST(QUOTENAME(c2.name) + CASE WHEN x.is_descending_key = 1 THEN ' DESC' ELSE '' END AS nvarchar(max)), ', ')
                               WITHIN GROUP (ORDER BY x.key_ordinal)
                          FROM sys.index_columns x JOIN sys.columns c2 ON c2.object_id = x.object_id AND c2.column_id = x.column_id
                         WHERE x.object_id = i.object_id AND x.index_id = i.index_id AND x.key_ordinal > 0)
                     + ')' AS nvarchar(max))
            FROM tbl
            JOIN sys.key_constraints kc ON kc.parent_object_id = tbl.object_id
            JOIN sys.indexes i ON i.object_id = kc.parent_object_id AND i.index_id = kc.unique_index_id
            UNION ALL
            SELECT 3, ROW_NUMBER() OVER (ORDER BY ck.name),
                CAST('    CONSTRAINT ' + QUOTENAME(ck.name) + ' CHECK ' + ck.definition AS nvarchar(max))
            FROM tbl JOIN sys.check_constraints ck ON ck.parent_object_id = tbl.object_id
            UNION ALL
            SELECT 4, ROW_NUMBER() OVER (ORDER BY fk.name),
                CAST('    CONSTRAINT ' + QUOTENAME(fk.name) + ' FOREIGN KEY ('
                     + (SELECT STRING_AGG(CAST(QUOTENAME(pc.name) AS nvarchar(max)), ', ') WITHIN GROUP (ORDER BY f.constraint_column_id)
                          FROM sys.foreign_key_columns f JOIN sys.columns pc ON pc.object_id = f.parent_object_id AND pc.column_id = f.parent_column_id
                         WHERE f.constraint_object_id = fk.object_id)
                     + ') REFERENCES ' + QUOTENAME(SCHEMA_NAME(rt.schema_id)) + '.' + QUOTENAME(rt.name) + ' ('
                     + (SELECT STRING_AGG(CAST(QUOTENAME(rc.name) AS nvarchar(max)), ', ') WITHIN GROUP (ORDER BY f.constraint_column_id)
                          FROM sys.foreign_key_columns f JOIN sys.columns rc ON rc.object_id = f.referenced_object_id AND rc.column_id = f.referenced_column_id
                         WHERE f.constraint_object_id = fk.object_id)
                     + ') ON DELETE ' + REPLACE(fk.delete_referential_action_desc, '_', ' ')
                     + ' ON UPDATE ' + REPLACE(fk.update_referential_action_desc, '_', ' ') AS nvarchar(max))
            FROM tbl
            JOIN sys.foreign_keys fk ON fk.parent_object_id = tbl.object_id
            JOIN sys.tables rt ON rt.object_id = fk.referenced_object_id
        ), extra AS (
            SELECT 1 AS grp, ROW_NUMBER() OVER (ORDER BY i.name) AS ord,
                CAST('CREATE ' + CASE WHEN i.is_unique = 1 THEN 'UNIQUE ' ELSE '' END
                     + CASE i.type WHEN 1 THEN 'CLUSTERED' ELSE 'NONCLUSTERED' END + ' INDEX ' + QUOTENAME(i.name)
                     + ' ON ' + QUOTENAME(tbl.sch) + '.' + QUOTENAME(tbl.tab) + ' ('
                     + (SELECT STRING_AGG(CAST(QUOTENAME(c2.name) + CASE WHEN x.is_descending_key = 1 THEN ' DESC' ELSE '' END AS nvarchar(max)), ', ')
                               WITHIN GROUP (ORDER BY x.key_ordinal)
                          FROM sys.index_columns x JOIN sys.columns c2 ON c2.object_id = x.object_id AND c2.column_id = x.column_id
                         WHERE x.object_id = i.object_id AND x.index_id = i.index_id AND x.key_ordinal > 0) + ')'
                     + COALESCE(' INCLUDE ('
                         + (SELECT STRING_AGG(CAST(QUOTENAME(c2.name) AS nvarchar(max)), ', ') WITHIN GROUP (ORDER BY x.index_column_id)
                              FROM sys.index_columns x JOIN sys.columns c2 ON c2.object_id = x.object_id AND c2.column_id = x.column_id
                             WHERE x.object_id = i.object_id AND x.index_id = i.index_id AND x.is_included_column = 1) + ')', '')
                     + CASE WHEN i.has_filter = 1 THEN ' WHERE ' + i.filter_definition ELSE '' END AS nvarchar(max)) AS txt
            FROM tbl JOIN sys.indexes i ON i.object_id = tbl.object_id
            WHERE i.type IN (1, 2) AND i.is_primary_key = 0 AND i.is_unique_constraint = 0
            UNION ALL
            SELECT 2, ep.minor_id,
                CAST('EXEC sp_addextendedproperty N''MS_Description'', N''' + REPLACE(CAST(ep.value AS nvarchar(max)), '''', '''''')
                     + ''', N''SCHEMA'', N''' + REPLACE(tbl.sch, '''', '''''') + ''', N''TABLE'', N''' + REPLACE(tbl.tab, '''', '''''') + ''''
                     + CASE WHEN ep.minor_id > 0
                            THEN ', N''COLUMN'', N''' + REPLACE(COL_NAME(tbl.object_id, ep.minor_id), '''', '''''') + ''''
                            ELSE '' END AS nvarchar(max))
            FROM tbl JOIN sys.extended_properties ep
              ON ep.class = 1 AND ep.major_id = tbl.object_id AND ep.name = 'MS_Description'
        )
        SELECT 'CREATE TABLE ' + QUOTENAME(tbl.sch) + '.' + QUOTENAME(tbl.tab) + ' (' + CHAR(10)
            + (SELECT STRING_AGG(txt COLLATE DATABASE_DEFAULT, ',
        ') WITHIN GROUP (ORDER BY grp, ord) FROM lines)
            + CHAR(10) + ');'
            + COALESCE((SELECT STRING_AGG(CHAR(10) + txt COLLATE DATABASE_DEFAULT + ';', '') WITHIN GROUP (ORDER BY grp, ord) FROM extra), '')
            AS ddl
        FROM tbl
      caveats:
        - "There is no SHOW CREATE TABLE (SSMS scripts it client-side); the statement is assembled from sys.* views: columns with exact type, collation, IDENTITY(seed, increment), computed columns, named DEFAULT constraints, primary key / unique (clustered or not), CHECK, foreign keys, other rowstore indexes (INCLUDE, filter) and MS_Description comments."
        - "Not included: filegroups / partition schemes, data compression and other index options, columnstore / XML / spatial / full-text indexes, temporal tables, memory-optimized tables, triggers, permissions."
        - "Output is one batch (no GO needed). Catalog texts have different collations; they are aggregated with COLLATE DATABASE_DEFAULT."
      sources: [{ evidence: tested }]
  sqlite:
    - status: supported
      requires: [schema, table_name]
      result_column: 1
      template: |
        SELECT m.sql || ';'
            || coalesce((SELECT group_concat(char(10) || i.sql || ';', '')
                           FROM {{schema}}.sqlite_master i
                          WHERE i.type = 'index' AND i.tbl_name = m.name AND i.sql IS NOT NULL), '')
            AS ddl
        FROM {{schema}}.sqlite_master m
        WHERE m.type = 'table' AND m.name = {{table_name}}
      caveats:
        - "SQLite keeps the original CREATE TABLE / CREATE INDEX text (incl. comments and formatting) - this is exact, not reconstructed. Automatic indexes of UNIQUE / PRIMARY KEY constraints have no text and come back with the table."
        - "Several statements: run them as a script (sqlite3_exec / executescript), not with a single prepare."
      sources: [{ evidence: tested }]
  manticore:
    - status: supported
      template: "SHOW CREATE TABLE {{table}}"
      requires: [table]
      result_column: 2
      caveats:
        - "Includes the table settings (min_infix_len, morphology, ...) and normalized defaults (e.g. index_exact_words added by morphology); type names differ from DESCRIBE (integer vs uint, multi vs mva)."
        - "Distributed tables: CREATE TABLE t type='distributed' local='a' agent='host:port:t' - the referenced tables must exist."
      sources: [{ evidence: tested }]
  sphinx:
    - since: "3"
      status: supported
      template: "SHOW CREATE TABLE {{table}}"
      requires: [table]
      result_column: 2
      caveats: ["The id column comes first and is required by CREATE TABLE. 2.2 has no SHOW CREATE TABLE (indexes are config sections)."]
      sources: [{ evidence: tested }]
