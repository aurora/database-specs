# yaml-language-server: $schema=../../schemas/operation.schema.json
id: introspection.trigger-ddl
title: Reconstruct the CREATE TRIGGER statement of a trigger
parameters:
  - { name: trigger, kind: qualified-identifier, description: "MySQL / MariaDB (schema.trigger)." }
  - { name: schema_name, kind: string-literal, description: "PostgreSQL." }
  - { name: table_name, kind: string-literal, description: "PostgreSQL." }
  - { name: trigger_name, kind: string-literal, description: "PostgreSQL." }

  - { name: schema, kind: identifier, description: "SQLite: schema (main, temp or an attached database)." }
implementations:
  mysql:
    - status: supported
      template: "SHOW CREATE TRIGGER {{trigger}}"
      requires: [trigger]
      result_column: 3
      caveats:
        - "Column 3 is the original statement incl. DEFINER; FOLLOWS / PRECEDES ordering is not part of it."
      sources: [{ evidence: tested }]
  mariadb:
    - status: supported
      template: "SHOW CREATE TRIGGER {{trigger}}"
      requires: [trigger]
      result_column: 3
      caveats: ["As MySQL."]
      sources: [{ evidence: tested }]
  postgresql:
    - status: supported
      requires: [schema_name, table_name, trigger_name]
      result_column: 1
      template: |
        SELECT pg_get_triggerdef(t.oid, true) || ';'
            || CASE WHEN t.tgenabled = 'D'
                    THEN E'\nALTER TABLE ' || quote_ident(n.nspname) || '.' || quote_ident(c.relname)
                         || ' DISABLE TRIGGER ' || quote_ident(t.tgname) || ';'
                    ELSE '' END
            AS ddl
        FROM pg_catalog.pg_trigger t
        JOIN pg_catalog.pg_class c     ON c.oid = t.tgrelid
        JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
        WHERE n.nspname = {{schema_name}} AND c.relname = {{table_name}} AND t.tgname = {{trigger_name}}
          AND NOT t.tgisinternal
      caveats:
        - "The trigger function is a separate object (introspection.routine-ddl) and must exist first."
      sources: [{ evidence: tested }]
  sqlserver:
    - status: supported
      requires: [schema_name, table_name, trigger_name]
      result_column: 1
      template: |
        SELECT m.definition
            + CASE WHEN t.is_disabled = 1
                   THEN CHAR(10) + 'GO' + CHAR(10) + 'DISABLE TRIGGER ' + QUOTENAME(s.name) + '.' + QUOTENAME(t.name)
                        + ' ON ' + QUOTENAME(s.name) + '.' + QUOTENAME(o.name)
                   ELSE '' END
            AS ddl
        FROM sys.triggers t
        JOIN sys.objects o     ON o.object_id = t.parent_id
        JOIN sys.schemas s     ON s.schema_id = o.schema_id
        JOIN sys.sql_modules m ON m.object_id = t.object_id
        WHERE s.name = {{schema_name}} AND o.name = {{table_name}} AND t.name = {{trigger_name}}
      caveats: ["The original CREATE TRIGGER text; trigger firing order (sp_settriggerorder) is not included."]
      sources: [{ evidence: tested }]
  sqlite:
    - status: supported
      requires: [schema, trigger_name]
      result_column: 1
      template: "SELECT m.sql || ';' AS ddl FROM {{schema}}.sqlite_master m WHERE m.type = 'trigger' AND m.name = {{trigger_name}}"
      caveats: ["The original text; the body contains ';' - execute as one statement or a script, never split on ';'."]
      sources: [{ evidence: tested }]
  manticore:
    - status: unsupported
      caveats: ["No triggers."]
      sources: [{ evidence: docs }]
  sphinx:
    - status: unsupported
      sources: [{ evidence: observed, notes: "Sphinx 2.2.11, 3.9.1" }]
