# yaml-language-server: $schema=../../schemas/operation.schema.json
id: query.browse-table
title: Fetch one page of table rows for the data grid
parameters:
  - { name: table, kind: qualified-identifier }
  - { name: where, kind: sql-fragment, description: Optional filter expression. }
  - { name: order_by, kind: sql-fragment, description: "Optional ORDER BY list; use the primary key for stable paging." }
  - { name: limit, kind: integer }
  - { name: offset, kind: integer }

implementations:
  mysql:
    - status: supported
      template: "SELECT * FROM {{table}}{{#where}} WHERE {{where}}{{/where}}{{#order_by}} ORDER BY {{order_by}}{{/order_by}} LIMIT {{limit}} OFFSET {{offset}}"
      notes: ["Large OFFSETs are slow; for big tables prefer keyset paging on the primary key."]
  mariadb:
    - status: supported
      template: "SELECT * FROM {{table}}{{#where}} WHERE {{where}}{{/where}}{{#order_by}} ORDER BY {{order_by}}{{/order_by}} LIMIT {{limit}} OFFSET {{offset}}"
  sqlserver:
    - since: "11"
      status: supported
      template: "SELECT * FROM {{table}}{{#where}} WHERE {{where}}{{/where}} ORDER BY {{#order_by}}{{order_by}}{{/order_by}}{{^order_by}}(SELECT NULL){{/order_by}} OFFSET {{offset}} ROWS FETCH NEXT {{limit}} ROWS ONLY"
      notes:
        - "OFFSET/FETCH needs ORDER BY; ORDER BY (SELECT NULL) means no particular (and no stable) order."
        - "Before 2012 (11) paging needs TOP / ROW_NUMBER() - not covered."
  sqlite:
    - status: supported
      template: "SELECT * FROM {{table}}{{#where}} WHERE {{where}}{{/where}}{{#order_by}} ORDER BY {{order_by}}{{/order_by}} LIMIT {{limit}} OFFSET {{offset}}"
      notes: ["Without ORDER BY rows usually come in rowid order, but that is not guaranteed. For keyset paging on rowid tables, WHERE rowid > ? ORDER BY rowid."]
  postgresql:
    - status: supported
      template: "SELECT * FROM {{table}}{{#where}} WHERE {{where}}{{/where}}{{#order_by}} ORDER BY {{order_by}}{{/order_by}} LIMIT {{limit}} OFFSET {{offset}}"
      notes: ["Without ORDER BY the row order is not stable between pages (no implicit clustering)."]
