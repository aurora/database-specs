# yaml-language-server: $schema=../../../schemas/query.schema.json
id: introspection.list-columns
title: List the columns of a table or view
parameters:
  - { name: schema, type: string, description: "Database (MySQL) / schema (PostgreSQL)." }
  - { name: table, type: string }

result:
  order: ordinal_position
  columns:
    - { name: schema_name, type: string, nullable: false }
    - { name: table_name, type: string, nullable: false }
    - { name: column_name, type: string, nullable: false }
    - name: ordinal_position
      type: integer
      nullable: false
      description: 1-based position among existing columns, without gaps.
    - name: data_type
      type: string
      nullable: false
      description: Engine-native full type as the engine renders it (MySQL COLUMN_TYPE, PostgreSQL format_type()).
    - { name: is_nullable, type: boolean, nullable: false }
    - name: default_raw
      type: string
      nullable: true
      description: >
        Default as reported by the engine, NOT normalized. NULL = no default (or generated column).
        See variant notes - the representation differs between engines.
    - { name: is_auto_increment, type: boolean, nullable: false, description: "AUTO_INCREMENT / SERIAL / IDENTITY." }
    - { name: generation_expression, type: string, nullable: true }
    - { name: generation_kind, type: string, nullable: true, enum: [stored, virtual] }
    - name: collation
      type: string
      nullable: true
      description: Collation as reported by the engine (see variant notes).
    - { name: comment, type: string, nullable: true, description: "NULL when there is no comment." }

variants:
  - engine: mysql
    since: "5.7"
    file: mysql.sql
    notes:
      - "default_raw: string literals come back unquoted (DEFAULT 'abc' -> abc) and CURRENT_TIMESTAMP comes back bare, so a string default 'CURRENT_TIMESTAMP' looks like the function. Since 8.0.13 expression defaults are flagged with DEFAULT_GENERATED in EXTRA (unverified)."
      - "collation: reported for every character column (effective collation)."
      - "data_type: integer display width (int(11)) is dropped from 8.0.19 on, except tinyint(1) and ZEROFILL columns."
  - engine: mariadb
    since: "10.2.7"
    file: mariadb.sql
    notes:
      - "default_raw: COLUMN_DEFAULT is an SQL expression since 10.2.7 (strings quoted: 'x'; functions as current_timestamp()). MariaDB reports the string NULL both for DEFAULT NULL and for nullable columns without default; both are mapped to SQL NULL (a string default 'NULL' arrives quoted and stays distinguishable)."
      - "data_type keeps the integer display width (int(11))."
      - "JSON columns appear as longtext with collation utf8mb4_bin (JSON is an alias plus a json_valid() CHECK constraint)."
      - "collation: reported for every character column (effective collation)."
    sources: [{ evidence: observed, verified_at: 2026-11-24, notes: "MariaDB 11.4.13" }]
  - engine: postgresql
    since: "12"
    file: postgresql.sql
    notes:
      - "default_raw: SQL expression as rendered by pg_get_expr(), e.g. 'abc'::character varying. SERIAL columns report nextval('...'::regclass)."
      - "collation: only set when it differs from the type's default collation."
      - "ordinal_position is renumbered (attnum has gaps after DROP COLUMN)."
  - engine: sqlserver
    since: "14"
    file: sqlserver.sql
    notes:
      - "data_type is rebuilt from sys.types + length/precision/scale (nvarchar length in characters, (max) for -1). Alias types are reported by their own name; float/real without precision."
      - "default_raw is the stored definition of the DEFAULT constraint, wrapped in parentheses by the server: ('x'), ((1)), (getdate())."
      - "comment comes from the extended property MS_Description (the SSMS convention)."
      - "generation_expression is the computed column definition; persisted = stored, otherwise virtual."
      - "collation: set for every character column."
  - engine: sqlite
    since: "3.26"
    file: sqlite.sql
    notes:
      - "data_type is the declared type as written (may be empty); it only determines the column affinity."
      - "is_auto_increment = rowid alias: the single INTEGER PRIMARY KEY column of a rowid table (AUTOINCREMENT additionally prevents reuse of ids)."
      - "default_raw is the default expression as written, e.g. 'x', 1, CURRENT_TIMESTAMP."
      - "generation_kind from pragma_table_xinfo (generated columns since 3.31); generation_expression, collation and comment are not exposed by pragmas (only in the CREATE TABLE text) and are NULL."

  - engine: manticore
    file: manticore.sql
    inline_parameters: { table: identifier }
    transform:
      schema_name: { param: schema }
      table_name: { param: table }
      column_name: { column: Field }
      ordinal_position: { row_number: true }
      data_type: { column: Type }
      is_nullable: { column: Type, equals: json }
      default_raw: { const: null }
      is_auto_increment: { column: Field, equals: id }
      generation_expression: { const: null }
      generation_kind: { const: null }
      collation: { const: null }
      comment: { const: null }
    extra_columns:
      - name: properties
        column: Properties
        description: "Space-separated flags: indexed / stored (full-text fields), attribute, columnar, knn, ... Empty for plain attributes."
    notes:
      - "The implicit id column (bigint, document id) always comes first; an INSERT without id generates one (is_auto_increment)."
      - "data_type is Manticore's type name as DESCRIBE reports it (uint for INT, mva for MULTI, ...); SHOW CREATE TABLE spells some differently (integer, multi)."
      - "A text column is a full-text field: 'indexed' = searchable with MATCH(), 'stored' = returned by SELECT. string columns are attributes (filterable, sortable); 'indexed attribute' makes one also a full-text field."
      - "Attributes have no NULL: missing values read as 0 / empty string; only json attributes return NULL (is_nullable)."
      - "Percolate tables report id, query, tags, filters (the stored queries); distributed tables return (Agent, Type) rows instead - the transform fails for them, list their columns from a local table."
    sources: [{ evidence: observed, notes: "manticore 32.1.3" }]

  - engine: sphinx
    until: "3"
    file: sphinx.sql
    inline_parameters: { table: identifier }
    transform:
      schema_name: { param: schema }
      table_name: { param: table }
      column_name: { column: Field }
      ordinal_position: { row_number: true }
      data_type: { column: Type }
      is_nullable: { column: Type, equals: json }
      default_raw: { const: null }
      is_auto_increment: { const: false }
      generation_expression: { const: null }
      generation_kind: { const: null }
      collation: { const: null }
      comment: { const: null }
    notes:
      - "DESCRIBE returns (Field, Type) only. Full-text fields have Type 'field' (not text) and are not returned by SELECT (2.2 has no stored fields)."
      - "No generated ids: INSERT must give the id (is_auto_increment false)."
    sources: [{ evidence: observed, notes: "Sphinx 2.2.11, 3.9.1" }]
  - engine: sphinx
    since: "3"
    file: sphinx.sql
    inline_parameters: { table: identifier }
    transform:
      schema_name: { param: schema }
      table_name: { param: table }
      column_name: { column: Field }
      ordinal_position: { row_number: true }
      data_type: { column: Type }
      is_nullable: { column: Type, equals: json }
      default_raw: { const: null }
      is_auto_increment: { const: false }
      generation_expression: { const: null }
      generation_kind: { const: null }
      collation: { const: null }
      comment: { const: null }
    extra_columns:
      - { name: properties, column: Properties, description: "e.g. indexed (full-text fields)." }
      - { name: key, column: Key, description: "Index flag of the attribute as DESCRIBE reports it (empty for plain attributes)." }
    notes:
      - "DESCRIBE returns Field, Type, Properties, Key. Fields have Type 'field'; MVA attributes are uint_set / bigint_set."
      - "No generated ids: INSERT must give the id (is_auto_increment false)."
    sources: [{ evidence: observed, notes: "Sphinx 2.2.11, 3.9.1" }]

gaps:
  - "MySQL < 5.7 (no GENERATION_EXPRESSION column)."
  - "PostgreSQL < 12 (no attgenerated)."
  - "MariaDB < 10.2.7 (defaults not reported as expressions)."
  - "SQLite < 3.26 (no pragma_table_xinfo)."
  - "SQLite: generation_expression, collation (needs parsing the CREATE TABLE text)."
