# yaml-language-server: $schema=../../../schemas/query.schema.json
id: introspection.list-schemas
title: List schemas (MySQL/MariaDB databases)
description: Top level of the object tree. Only schemas visible to the current user are returned.
result:
  order: schema_name
  columns:
    - { name: schema_name, type: string, nullable: false }
    - name: is_system
      type: boolean
      nullable: false
      description: Engine-internal schema (information_schema, mysql, pg_catalog, ...); clients usually hide or group these.
    - { name: owner, type: string, nullable: true }
    - { name: default_charset, type: string, nullable: true }
    - { name: default_collation, type: string, nullable: true }
    - { name: comment, type: string, nullable: true }
variants:
  - engine: mysql
    since: "5.7"
    file: mysql.sql
    notes: ["A schema is a database. No owner and no comment."]
    sources: [{ evidence: tested }]
  - engine: mariadb
    since: "10.5"
    file: mariadb.sql
    notes: ["CREATE DATABASE ... COMMENT (since 10.5) is returned as comment."]
    sources: [{ evidence: tested }]
  - engine: postgresql
    since: "12"
    file: postgresql.sql
    notes:
      - "Schemas of the current database only; databases are a separate level (one connection per database). pg_toast and temporary schemas are left out."
      - "Since 15 the public schema is owned by pg_database_owner."
      - "Encoding / collation belong to the database, not the schema: NULL."
    sources: [{ evidence: tested }]
  - engine: sqlserver
    since: "14"
    file: sqlserver.sql
    notes:
      - "Schemas of the current database. Fixed database-role schemas (db_owner, ...; schema_id >= 16384), sys, INFORMATION_SCHEMA and guest are flagged is_system."
      - "Collation belongs to the database (and columns), not the schema."
  - engine: sqlite
    since: "3.26"
    file: sqlite.sql
    notes:
      - "Schemas are the attached databases (main, ATTACH ... AS name, and temp once a temporary object exists); temp is flagged is_system."
      - "default_charset is the text encoding of the main database (UTF-8 / UTF-16le / UTF-16be)."
  - engine: manticore
    file: manticore.sql
    transform:
      schema_name: { column: Database }
      is_system: { column: Database, equals: information_schema }
      owner: { const: null }
      default_charset: { const: null }
      default_collation: { const: null }
      comment: { const: null }
    notes:
      - "There is one database, Manticore (DATABASE() returns it); information_schema is a small emulation for MySQL tools (only a few columns are real, others return the string 'null'). All tables live in Manticore."
    sources: [{ evidence: observed, notes: "manticore 32.1.3" }]

not_applicable:
  sphinx: "No databases or schemas (SHOW DATABASES is empty)."

gaps:
  - "MariaDB 10.3 / 10.4: not verified (the test fixture uses syntax those versions lack); the variant may work."
