# yaml-language-server: $schema=../../../schemas/query.schema.json
id: introspection.list-tables
title: List tables and views of a schema
description: >
  Everything a client shows in its object tree for one schema (MySQL/MariaDB: database).
  Sequences are excluded (separate query).
parameters:
  - { name: schema, type: string, description: "Database (MySQL/MariaDB) / schema (PostgreSQL)." }

result:
  order: table_name
  columns:
    - { name: schema_name, type: string, nullable: false }
    - { name: table_name, type: string, nullable: false }
    - name: table_type
      type: string
      nullable: false
      enum: [table, partitioned-table, view, materialized-view, foreign-table, virtual-table, percolate-table, distributed-table]
    - name: partition_of
      type: string
      nullable: true
      description: Parent table name if this table is a partition (PostgreSQL only; MySQL partitions are not tables).
    - { name: storage_engine, type: string, nullable: true, description: "MySQL/MariaDB ENGINE, PostgreSQL table access method (heap)." }
    - name: row_estimate
      type: integer
      nullable: true
      description: Statistics-based estimate, never an exact count. NULL = unknown.
    - { name: data_bytes, type: integer, nullable: true }
    - { name: index_bytes, type: integer, nullable: true }
    - { name: collation, type: string, nullable: true, description: "Default collation of the table (MySQL/MariaDB)." }
    - { name: comment, type: string, nullable: true }

variants:
  - engine: mysql
    since: "5.7"
    file: mysql.sql
    notes:
      - "Since 8.0 TABLE_ROWS / DATA_LENGTH / INDEX_LENGTH come from cached statistics (information_schema_stats_expiry, default 24h) and can be NULL or stale for new tables; ANALYZE TABLE refreshes them."
      - "Views report TABLE_COMMENT = 'VIEW'; mapped to NULL."
      - "Partitioned tables are detected via CREATE_OPTIONS ('partitioned')."
  - engine: mariadb
    since: "10.6"
    file: mariadb.sql
    notes:
      - "TABLE_TYPE can also be SEQUENCE (excluded), SYSTEM VERSIONED (mapped to table) and TEMPORARY (excluded)."
      - "TABLE_ROWS of partitioned tables is a rough per-partition estimate (an empty table with one partition reported 2)."
      - "Views report TABLE_COMMENT = 'VIEW'; mapped to NULL."
  - engine: sqlserver
    since: "14"
    file: sqlserver.sql
    notes:
      - "table_type: external tables (PolyBase) -> foreign-table; tables on a partition scheme -> partitioned-table (SQL Server partitions are not separate tables). Indexed views remain view."
      - "storage_engine is only set for memory-optimized tables (In-Memory OLTP)."
      - "row_estimate is the row count from sys.partitions metadata (usually accurate, not guaranteed)."
      - "data_bytes / index_bytes from sys.allocation_units (used pages * 8 KB); no VIEW DATABASE STATE permission needed."
      - "System-versioned temporal history tables are listed as normal tables."
  - engine: sqlite
    since: "3.26"
    until: "3.37"
    file: sqlite-3.26.sql
    notes:
      - "Reads main.sqlite_master; returns no rows for other (attached) schemas - use 3.37+ or query <schema>.sqlite_master."
      - "Shadow tables of virtual tables (e.g. FTS5 *_data) are listed as tables; 3.37+ excludes them."
  - engine: sqlite
    since: "3.37"
    file: sqlite.sql
    notes:
      - "pragma_table_list (3.37+): all attached schemas, shadow tables excluded."
      - "storage_engine: rowid or without-rowid for tables (virtual tables: NULL)."
      - "No statistics without ANALYZE (sqlite_stat1) and no sizes without the dbstat virtual table (compile option); row_estimate, data_bytes and index_bytes are NULL."
      - "No table comments in SQLite."
  - engine: postgresql
    since: "12"
    file: postgresql.sql
    notes:
      - "row_estimate from pg_class.reltuples. Before 14 a never-analyzed table reports 0 (not unknown); since 14 it reports -1, mapped to NULL."
      - "data_bytes / index_bytes call pg_table_size() / pg_indexes_size() per table; on schemas with thousands of tables consider fetching them lazily."
      - "partition_of is the parent's name only; the parent may live in another schema."
  - engine: manticore
    file: manticore.sql
    transform:
      schema_name: { param: schema }
      table_name: { column: Table }
      table_type:
        column: Type
        map: { rt: table, local: table, percolate: percolate-table, distributed: distributed-table }
      partition_of: { const: null }
      storage_engine: { column: Type }
      row_estimate: { const: null }
      data_bytes: { const: null }
      index_bytes: { const: null }
      collation: { const: null }
      comment: { const: null }
    notes:
      - "SHOW TABLES ignores the schema (there is only the Manticore database); schema_name echoes the parameter."
      - "storage_engine is the Manticore table type: rt (real-time), local (plain, built by the indexer tool), percolate (stored queries), distributed (agents / local tables, no own data)."
      - "Sizes and document counts are in SHOW TABLE <name> STATUS (indexed_documents, ram_bytes, disk_bytes) - one statement per table."
    sources: [{ evidence: observed, notes: "manticore 32.1.3" }]
