# yaml-language-server: $schema=../../../schemas/query.schema.json
id: introspection.list-views
title: List views of a schema with their definition
parameters:
  - { name: schema, type: string }
result:
  order: view_name
  columns:
    - { name: schema_name, type: string, nullable: false }
    - { name: view_name, type: string, nullable: false }
    - name: definition
      type: string
      nullable: true
      description: The SELECT as stored/normalized by the engine (not the original text). NULL without the privilege to see it.
    - { name: is_materialized, type: boolean, nullable: false }
    - { name: is_updatable, type: boolean, nullable: true }
    - { name: check_option, type: string, nullable: true, enum: [local, cascaded] }
    - name: security_type
      type: string
      nullable: true
      enum: [definer, invoker]
      description: Whose privileges apply when the view is queried.
    - { name: comment, type: string, nullable: true }
variants:
  - engine: mysql
    since: "5.7"
    file: mysql.sql
    notes:
      - "definition is rewritten by the server: fully qualified, backtick-quoted names and generated aliases (`db`.`t`.`id` AS `id`), not the original text. Empty (NULL) without SHOW VIEW privilege."
      - "Views have no comments."
    sources: [{ evidence: tested }]
  - engine: mariadb
    since: "10.6"
    file: mysql.sql
    notes: ["Same as MySQL; MariaDB drops the outer parentheses of the WHERE condition."]
    sources: [{ evidence: tested }]
  - engine: postgresql
    since: "12"
    file: postgresql.sql
    notes:
      - "definition from pg_get_viewdef(view, true), trimmed and without the trailing ';'. Up to 15 column references are table-qualified (t.id), since 16 not."
      - "Materialized views are included (is_materialized); they are also tables in list-tables."
      - "security_type: invoker only with the security_invoker option (15+); otherwise the owner's privileges apply (definer)."
    sources: [{ evidence: tested }]
  - engine: sqlserver
    since: "14"
    file: sqlserver.sql
    notes:
      - "definition is cut from the original CREATE VIEW text (sys.sql_modules) after the first stand-alone AS; leading comments containing ' AS ' would confuse it. NULL for encrypted views."
      - "is_updatable and security_type are NULL (INFORMATION_SCHEMA.VIEWS always reports NO; views use ownership chaining). WITH CHECK OPTION is reported as cascaded."
      - "Indexed views are not flagged as materialized."
  - engine: sqlite
    since: "3.26"
    file: sqlite.sql
    notes:
      - "Reads main.sqlite_master (other schemas: no rows). definition is cut from the original text after the first ' AS '."
      - "Views are read-only unless INSTEAD OF triggers exist: is_updatable false."

gaps:
  - "Manticore: no SQL views (CREATE VIEW is a syntax error), but materialized views of the Kafka integration (Buddy): SHOW MATERIALIZED VIEWS (name) / SHOW SOURCES; not mapped yet."
