# yaml-language-server: $schema=schemas/roadmap.schema.json
# Planned specs that do not exist yet. What exists is listed in COVERAGE.md automatically
# (generated by `uv run dbspecs coverage`, also after every `dbspecs test`).
# Remove an item once its spec file exists - `dbspecs validate` reports finished items.

items:
  # --- object tree / client features ------------------------------------------
  - id: introspection.list-databases
    kind: query
    title: List databases (server level above schemas)
    priority: high
    engines: [postgresql, sqlserver]
    notes: ["MySQL/MariaDB databases are schemas (list-schemas); SQLite has attached databases only."]
  - id: introspection.list-users
    kind: query
    title: List users / roles / logins
    priority: high
    engines: [mysql, mariadb, postgresql, sqlserver]
  - id: introspection.list-privileges
    kind: query
    title: List privileges (grants) of a user or on an object
    priority: high
    engines: [mysql, mariadb, postgresql, sqlserver]
  - id: introspection.list-events
    kind: query
    title: List scheduled events
    priority: medium
    engines: [mysql, mariadb]
    notes: ["SQL Server Agent jobs live in msdb; possibly a separate item."]
  - id: introspection.list-types
    kind: query
    title: List user-defined types (enum, domain, composite, range; alias and table types)
    priority: high
    engines: [postgresql, sqlserver]
  - id: introspection.list-extensions
    kind: query
    title: List installed extensions
    priority: medium
    engines: [postgresql]
  - id: introspection.list-partitions
    kind: query
    title: List partitions of a table with bounds
    priority: medium
    engines: [mysql, mariadb, postgresql, sqlserver]
  - id: introspection.server-variables
    kind: query
    title: Server / session settings (sql_mode, search_path, compatibility level, ...)
    priority: medium

  # --- session / admin operations -----------------------------------------------
  - id: session.list-processes
    kind: query
    title: Running sessions and queries (process list)
    priority: high
    engines: [mysql, mariadb, postgresql, sqlserver]
  - id: session.cancel-query
    kind: operation
    title: Cancel a running query / kill a session
    priority: high
    engines: [mysql, mariadb, postgresql, sqlserver]
    notes: ["PostgreSQL also has a protocol-level cancel request (PQcancel); SQLite sqlite3_interrupt()."]
  - id: query.explain
    kind: operation
    title: Execution plan (EXPLAIN variants and output formats)
    priority: high
  - id: session.use-schema
    kind: operation
    title: Switch the current schema / database
    priority: medium

  # --- capabilities ------------------------------------------------------------------
  - id: dml.upsert
    kind: capability
    title: Insert-or-update (ON DUPLICATE KEY / ON CONFLICT / MERGE / UPSERT)
    priority: high
  - id: transactions.savepoints
    kind: capability
    title: Savepoints
    priority: medium
  - id: transactions.isolation-levels
    kind: capability
    title: Supported isolation levels and the default
    priority: medium
  - id: query.json
    kind: capability
    title: JSON type, functions and operators
    priority: medium
  - id: query.full-outer-join
    kind: capability
    title: FULL / RIGHT OUTER JOIN
    priority: low
  - id: query.lateral
    kind: capability
    title: LATERAL / CROSS APPLY
    priority: low

  # --- syntax ------------------------------------------------------------------------
  - id: ddl.create-table
    kind: syntax
    title: CREATE TABLE syntax (columns, constraints, table options)
    priority: high
  - id: ddl.alter-table
    kind: syntax
    title: ALTER TABLE syntax
    priority: medium
  - id: dml.select
    kind: syntax
    title: SELECT skeleton (joins, grouping, paging, locking clauses)
    priority: medium
  - id: dml.insert
    kind: syntax
    title: INSERT incl. upsert clauses
    priority: medium

  # --- lexical / protocol ------------------------------------------------------------
  - id: lexical.functions
    kind: lexical
    title: Built-in function lists per version (autocomplete, highlighting)
    priority: medium
  - id: connection-parameters
    kind: protocol
    title: Connection parameters, authentication plugins and TLS modes per protocol
    priority: medium
  - id: tds-type-codes-verified
    kind: protocol
    title: Verify the TDS / ODBC type codes against msodbcsql (currently unverified)
    priority: low

  # --- engines -------------------------------------------------------------------------
  - id: azure-sql
    kind: engine
    title: Azure SQL Database / Managed Instance
    priority: low
  - id: percona
    kind: engine
    title: Percona Server for MySQL
    priority: low
  - id: tidb
    kind: engine
    title: TiDB (MySQL protocol)
    priority: low
  - id: cockroachdb
    kind: engine
    title: CockroachDB (PostgreSQL protocol)
    priority: low
  - id: manticore
    kind: engine
    title: Manticore Search (MySQL protocol, own SQL dialect)
    priority: low
