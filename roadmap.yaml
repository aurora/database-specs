# yaml-language-server: $schema=schemas/roadmap.schema.json
# Planned specs that do not exist yet. What exists is listed in COVERAGE.md automatically
# (generated by `uv run dbspecs coverage`, also after every `dbspecs test`).
# Remove an item once its spec file exists - `dbspecs validate` reports finished items.

items:
  # --- object tree / client features ------------------------------------------
  - id: introspection.list-events
    kind: query
    title: List scheduled events
    priority: medium
    engines: [mysql, mariadb]
    notes: ["SQL Server Agent jobs live in msdb; possibly a separate item."]
  - id: introspection.list-extensions
    kind: query
    title: List installed extensions
    priority: medium
    engines: [postgresql]
  - id: introspection.list-partitions
    kind: query
    title: List partitions of a table with bounds
    priority: medium
    engines: [mysql, mariadb, postgresql, sqlserver]
  - id: introspection.server-variables
    kind: query
    title: Server / session settings (sql_mode, search_path, compatibility level, ...)
    priority: medium
    notes:
      - "Manticore: the variable names (session: AUTOCOMMIT, COLLATION_CONNECTION, PROFILING, ro, WAIT_TIMEOUT, NET_READ_TIMEOUT, ...; about 30 global ones) are only listed in the text of manual/english/Server_settings/Setting_variables_online.md, not as inventory items - take them from there. User variables: SET GLOBAL @v = (1, 3) for IN @v filters."

  - id: introspection.table-statistics
    kind: query
    title: Per-table statistics (row count, sizes) where list-tables cannot include them
    priority: medium
    engines: [manticore]
    notes: ["Manticore: SHOW TABLE <name> STATUS (one statement per table); SHOW TABLE <name> INDEXES lists secondary indexes."]

  # --- session / admin operations -----------------------------------------------
  - id: session.use-schema
    kind: operation
    title: Switch the current schema / database
    priority: medium

  # --- capabilities ------------------------------------------------------------------
  - id: transactions.savepoints
    kind: capability
    title: Savepoints
    priority: medium
  - id: transactions.isolation-levels
    kind: capability
    title: Supported isolation levels and the default
    priority: medium
  - id: query.json
    kind: capability
    title: JSON type, functions and operators
    priority: medium
  - id: query.full-outer-join
    kind: capability
    title: FULL / RIGHT OUTER JOIN
    priority: low
    notes: ["MySQL and MariaDB have no FULL JOIN, and the mistake is silent: in t FULL JOIN u USING (id) FULL is read as the alias of t, so the query runs as an inner join (observed MySQL 8.4.13, 9.7.4, MariaDB 11.4.13). The spec should say so for AI-generated SQL."]
  - id: query.lateral
    kind: capability
    title: LATERAL / CROSS APPLY
    priority: low

  # --- syntax ------------------------------------------------------------------------
  - id: ddl.create-table
    kind: syntax
    title: CREATE TABLE syntax (columns, constraints, table options)
    priority: high
  - id: ddl.alter-table
    kind: syntax
    title: ALTER TABLE syntax
    priority: medium
  - id: dml.select
    kind: syntax
    title: SELECT skeleton (joins, grouping, paging, locking clauses)
    priority: medium
  - id: dml.insert
    kind: syntax
    title: INSERT incl. upsert clauses
    priority: medium
  - id: dml.update
    kind: syntax
    title: UPDATE incl. multi-table forms, ORDER BY / LIMIT
    priority: medium
  - id: dml.delete
    kind: syntax
    title: DELETE incl. multi-table forms, ORDER BY / LIMIT
    priority: medium
  - id: dml.load-data
    kind: syntax
    title: Bulk import / export statements (LOAD DATA, SELECT ... INTO OUTFILE, COPY, BULK INSERT)
    priority: low
  - id: ddl.create-schema
    kind: syntax
    title: CREATE / ALTER / DROP DATABASE or SCHEMA with options (charset, collation, encryption)
    priority: medium
  - id: ddl.create-view
    kind: syntax
    title: CREATE / ALTER / DROP VIEW (algorithm, security, check option, materialized views)
    priority: medium
  - id: ddl.create-event
    kind: syntax
    title: CREATE / ALTER / DROP EVENT (schedule grammar)
    priority: low
    engines: [mysql, mariadb]
  - id: admin.table-maintenance
    kind: operation
    title: Table maintenance actions (ANALYZE / OPTIMIZE / CHECK / REPAIR / CHECKSUM TABLE, VACUUM, UPDATE STATISTICS)
    priority: low
  - id: ddl.create-trigger
    kind: syntax
    title: CREATE / DROP TRIGGER
    priority: low
  - id: ddl.create-routine
    kind: syntax
    title: CREATE / ALTER / DROP FUNCTION and PROCEDURE incl. the stored-program language (compound statements, handlers, cursors)
    priority: medium
  - id: admin.user-management
    kind: syntax
    title: CREATE / ALTER / DROP USER and ROLE, GRANT / REVOKE, SET ROLE / PASSWORD
    priority: medium
  - id: syntax.show-statements
    kind: syntax
    title: SHOW statements (query-editor autocomplete; the object tree uses the introspection queries)
    priority: low
    engines: [mysql, mariadb, manticore, sphinx]
  - id: query.optimizer-hints
    kind: syntax
    title: Optimizer hints (/*+ ... */ in MySQL, OPTION (...) in SQL Server) and index hints
    priority: low
  - id: transactions.control
    kind: syntax
    title: Transaction control (BEGIN / START TRANSACTION options, COMMIT / ROLLBACK [AND CHAIN], autocommit, LOCK TABLES)
    priority: medium
  - id: dml.call
    kind: syntax
    title: CALL statements (Manticore SUGGEST / QSUGGEST / SNIPPETS / KEYWORDS / PQ / AUTOCOMPLETE, stored procedure calls)
    priority: medium
    notes: ["Manticore's CALL AUTOCOMPLETE / SUGGEST are directly useful for a client's search UI."]
  - id: fulltext.mysql-boolean-query
    kind: syntax
    title: Operator language inside AGAINST ('...' IN BOOLEAN MODE) for MySQL / MariaDB
    priority: medium
    engines: [mysql, mariadb]
    notes: ["Counterpart of fulltext.manticore-query; referenced from the lexical specs' embedded_languages."]
  - id: fulltext.postgresql-tsquery
    kind: syntax
    title: tsquery / websearch_to_tsquery input syntax
    priority: low
    engines: [postgresql]

  # --- lexical / protocol ------------------------------------------------------------
  - id: lexical.functions
    kind: lexical
    title: Built-in function lists per version (autocomplete, highlighting)
    priority: medium
    notes:
      - "Manticore: the func: inventory items (function table g_dFuncs in src/sphinxexpr.cpp) are the complete name list; the Functions pages miss some (DATABASE, CURRENT_USER, VERSION, RANKFACTORS). MADD / MUL3 work but are undocumented helpers."
  - id: connection-parameters
    kind: protocol
    title: Connection parameters, authentication plugins and TLS modes per protocol
    priority: medium
  - id: tds-type-codes-verified
    kind: protocol
    title: Verify the TDS / ODBC type codes against msodbcsql (currently unverified)
    priority: low

  # --- engines -------------------------------------------------------------------------
  - id: azure-sql
    kind: engine
    title: Azure SQL Database / Managed Instance
    priority: low
  - id: percona
    kind: engine
    title: Percona Server for MySQL
    priority: low
  - id: tidb
    kind: engine
    title: TiDB (MySQL protocol)
    priority: low
  - id: cockroachdb
    kind: engine
    title: CockroachDB (PostgreSQL protocol)
    priority: low
