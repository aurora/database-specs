# yaml-language-server: $schema=../../../schemas/syntax.schema.json
id: query.fulltext-select
title: SELECT with full-text search
description: >
  Where the full-text condition may stand in a SELECT, which differs fundamentally: in MySQL /
  MariaDB MATCH ... AGAINST is an ordinary expression, in Manticore MATCH('...') is a clause-like
  item of the top-level AND chain. The Manticore grammar also covers its grouping (GROUP n BY,
  WITHIN GROUP ORDER BY), FACET and OPTION. Capabilities: query.fulltext-search,
  query.top-n-per-group, query.multi-result-select.

grammars:
  manticore:
    file: manticore.ebnf
    start: select
    notes:
      - "MATCH() items belong to the top-level AND chain (in OR or under NOT: syntax error; parentheses only around a single MATCH). One per table: a second MATCH needs a JOIN and the table as second argument, otherwise 'too many MATCH() clauses'."
      - "Precedence trap: everything after the last MATCH item is one filter, so MATCH('a') AND x = 1 OR y = 2 means MATCH('a') AND (x = 1 OR y = 2). Before a MATCH item, a top-level OR is a syntax error."
      - "HAVING takes a single predicate (no AND / OR). Optimizer hints go into a comment after the statement (SecondaryIndex(col), ColumnarScan(col), DocidIndex(col) and NO_ variants)."
      - "Full-text fields cannot be compared (title = 'x' is an error: filters only work on attributes)."
      - "ORDER BY items need ASC or DESC. Without LIMIT 20 rows are returned."
      - "GROUP n BY returns up to n rows per group; WITHIN GROUP ORDER BY chooses them; plain columns next to aggregates are allowed (one representative row per group)."
      - "Each FACET adds a result set (query.multi-result-select)."
      - "Subqueries only as SELECT * FROM (SELECT ...) ORDER BY ... (re-sorting). JOIN: INNER / LEFT with ON equality conditions (casts like ON a = INT(b) are not covered)."
      - "JSON attributes: meta.a.b, meta['a'], meta.k[0] in the select list and filters. String attributes: brand ANY ('a', 'b'). No LIKE in WHERE."
      - "FACET items are expressions (INTERVAL(price, 200, 400) AS r); BY, ALL / EXCLUDE FILTERS, ZEROES, MODE, DISTINCT, ORDER BY FACET() / COUNT(*) and LIMIT per facet."
      - "Not covered: KNN / HYBRID_MATCH, sub-selects, table functions, SELECT ... FROM t.@table (crashes 32.1.3, see engine notes)."
      - "Version boundaries from the grammar diffs (dbspecs inventory-diff) and tests: JOIN with table-qualified columns, FACET ... FILTERS / MODE since 27.1 (absent in 25.0.0; 26.x has no image and is untested), FACET ... ZEROES since 28.4, GROUP_CONCAT(... SEPARATOR / ORDER BY) since 28.6. 25.0 parses JOIN but rejects qualified columns ('unknown column')."
    sources: [{ evidence: tested }]
  sphinx:
    file: sphinx.ebnf
    start: select
    since: "2.2"
    notes:
      - "Same heritage as Manticore (MATCH(), GROUP n BY, WITHIN GROUP ORDER BY, FACET, OPTION), but stricter: one MATCH() only, no OR after it at top level, no JOIN, only LIMIT offset, count."
      - "2.2 has no OR in WHERE at all (not even without MATCH or in parentheses); 3.x allows OR, except at the top level after MATCH."
      - "Full-text fields are not attributes: they cannot be selected (2.2), filtered or sorted."
    sources: [{ evidence: tested }]
  mysql:
    file: mysql.ebnf
    start: select
    since: "5.7"
    notes:
      - "MATCH (cols) AGAINST ('...') can be combined freely (OR, NOT, several MATCH); its value is the relevance, usable in the select list and ORDER BY."
      - "IN BOOLEAN MODE has its own operator language inside the string (+word -word \"phrase\" word* >word <word ~word (group)); not covered by a syntax spec yet."
    sources: [{ evidence: tested }]
  mariadb:
    file: mariadb.ebnf
    start: select
    since: "10.6"
    notes: ["Same MATCH ... AGAINST forms as MySQL."]
    sources: [{ evidence: tested }]

setup:
  sphinx:
    - "TRUNCATE RTINDEX t_ft"
    - "INSERT INTO t_ft (id, title, body, cat, price) VALUES (1, 'red apple pie', 'sweet dessert', 1, 3)"
    - "TRUNCATE RTINDEX probe_rt"
    - "INSERT INTO probe_rt (id, title, body, n, j) VALUES (1, 'x', 'y', 1, '{\"a\":{\"b\":1}}')"
  manticore:
    - "CREATE TABLE t_fts (title TEXT, body TEXT, cat INT, price FLOAT, tags MULTI, brand STRING, meta JSON)"
    - "INSERT INTO t_fts (id, title, body, cat, price, tags, brand, meta) VALUES (1, 'red apple pie', 'sweet dessert', 1, 3.5, (1,2), 'acme', '{\"a\":{\"b\":1},\"k\":[5,6]}')"
    - "CREATE TABLE t_cat (name TEXT, cid INT, attrs JSON)"
    - "INSERT INTO t_cat (id, name, cid, attrs) VALUES (1, 'fruit apple', 1, '{\"cid\":1}')"
  mysql:
    - "CREATE TABLE t_fts (id INT PRIMARY KEY, title VARCHAR(200), body TEXT, cat INT, price FLOAT, FULLTEXT (title, body), FULLTEXT (title)) ENGINE=InnoDB"
  mariadb:
    - "CREATE TABLE t_fts (id INT PRIMARY KEY, title VARCHAR(200), body TEXT, cat INT, price FLOAT, FULLTEXT (title, body), FULLTEXT (title)) ENGINE=InnoDB"
cleanup:
  sphinx: ["TRUNCATE RTINDEX t_ft", "TRUNCATE RTINDEX probe_rt"]
  manticore: ["DROP TABLE IF EXISTS t_fts", "DROP TABLE IF EXISTS t_cat"]
  mysql: ["DROP TABLE IF EXISTS t_fts"]
  mariadb: ["DROP TABLE IF EXISTS t_fts"]

examples:
  # --- Manticore
  - sql: "SELECT id, WEIGHT() AS w FROM t_fts WHERE MATCH('apple') ORDER BY w DESC LIMIT 10"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH('@title apple') AND cat = 1 AND price BETWEEN 1 AND 5"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE cat IN (1, 2) AND MATCH('apple') AND ANY(tags) = 2"
    expect: valid
    engines: { manticore: {} }
    notes: ["MATCH does not have to come first."]
  - sql: "SELECT id FROM t_fts WHERE MATCH('apple') AND (cat = 1 OR price > 2)"
    expect: valid
    engines: { manticore: {} }
    notes: ["OR is fine among the attribute filters."]
  - sql: "SELECT id FROM t_fts WHERE cat = 1 OR price > 2"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH('apple') OR cat = 2"
    expect: invalid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE NOT MATCH('apple')"
    expect: invalid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE (MATCH('apple') AND cat = 1)"
    expect: invalid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE cat = 1 AND (price > 1 OR MATCH('apple'))"
    expect: invalid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH('apple') AND MATCH('pie')"
    expect: semantic-error
    engines: { manticore: {} }
    notes: ["'too many MATCH() clauses': several MATCH items only with a JOIN, one per table."]
  - sql: "SELECT t_fts.id FROM t_fts INNER JOIN t_cat ON t_fts.cat = t_cat.cid WHERE MATCH('apple', t_fts) AND MATCH('fruit', t_cat)"
    expect: valid
    engines: { manticore: { since: "27.1" } }
  - sql: "SELECT t_fts.id FROM t_fts INNER JOIN t_cat ON t_fts.cat = t_cat.cid WHERE MATCH('apple', t_fts) AND MATCH('fruit', t_cat)"
    expect: invalid
    engines: { manticore: { until: "26" } }
  - sql: "SELECT t_fts.id, t_cat.name FROM t_fts LEFT JOIN t_cat ON t_fts.cat = t_cat.cid WHERE MATCH('apple')"
    expect: valid
    engines: { manticore: { since: "27.1" } }
  - sql: "SELECT t_fts.id, t_cat.name FROM t_fts LEFT JOIN t_cat ON t_fts.cat = t_cat.cid WHERE MATCH('apple')"
    expect: invalid
    engines: { manticore: { until: "26" } }
  - sql: "SELECT id FROM t_fts WHERE (MATCH('apple')) AND cat = 1"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH('apple', t_fts) AS m"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH('apple') AND cat = 1 OR price > 2"
    expect: valid
    engines: { manticore: {} }
    notes: ["Means MATCH('apple') AND (cat = 1 OR price > 2) - not SQL precedence (tests/cases/search-manticore.yaml checks the rows)."]
  - sql: "SELECT id FROM t_fts WHERE cat = 1 OR price > 2 AND MATCH('apple')"
    expect: invalid
    engines: { manticore: {} }
  - sql: "SELECT cat, COUNT(*) AS c FROM t_fts GROUP BY cat HAVING c > 0 AND c < 5"
    expect: invalid
    engines: { manticore: {} }
    notes: ["HAVING takes a single predicate."]
  - sql: "SELECT id FROM t_fts WHERE MATCH(title, 'apple')"
    expect: invalid
    engines: { manticore: {} }
    notes: ["No column list: restrict fields inside the query text (@title apple)."]
  - sql: "SELECT id FROM t_fts WHERE MATCH('apple') ORDER BY id"
    expect: invalid
    engines: { manticore: {} }
    notes: ["Server error 'no sort order defined'."]
  - sql: "SELECT id FROM t_fts WHERE title = 'red apple pie'"
    expect: semantic-error
    engines: { manticore: {} }
    notes: ["Full-text fields are not filterable."]
  - sql: "SELECT id, cat, price FROM t_fts GROUP 2 BY cat WITHIN GROUP ORDER BY price DESC ORDER BY cat ASC"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT cat, COUNT(*) AS c FROM t_fts WHERE MATCH('apple') GROUP BY cat HAVING c > 0 ORDER BY c DESC"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT * FROM t_fts WHERE MATCH('apple') FACET cat FACET price ORDER BY COUNT(*) DESC"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH('apple') LIMIT 0, 10 OPTION ranker = bm25, max_matches = 2000"
    expect: valid
    engines: { manticore: {} }
  # --- Manticore forms found by the inventory audit
  - sql: "SELECT id FROM t_fts FACET brand, cat"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts FACET brand BY cat"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts FACET brand DISTINCT cat"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts FACET INTERVAL(price, 2, 3) AS pr"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts FACET brand ORDER BY FACET() ASC LIMIT 5"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE cat = 1 FACET brand ALL FILTERS"
    expect: valid
    engines: { manticore: { since: "27.1" } }
  - sql: "SELECT id FROM t_fts WHERE cat = 1 FACET brand ALL FILTERS"
    expect: invalid
    engines: { manticore: { until: "26" } }
  - sql: "SELECT id FROM t_fts WHERE meta.a.b = 1"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id, meta.k[0] AS k0 FROM t_fts WHERE meta['a'].b = 1"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE brand ANY ('acme', 'other')"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH('apple') OPTION field_weights = (title = 10, body = 1), ranker = expr('sum(lcs) * 1000 + bm25')"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH('apple') OPTION ranker = sph04"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT t_fts.* FROM t_fts"
    expect: semantic-error
    engines: { manticore: {} }
    notes: ["The SQL parser has table.* (select_item), but 32.1.3 rejects it: 'unknown column' without a JOIN, an expression parse error with one."]
  - sql: "SELECT t_fts.*, t_cat.name FROM t_fts INNER JOIN t_cat ON t_fts.cat = t_cat.cid"
    expect: semantic-error
    engines: { manticore: { since: "27.1" } }
  - sql: "SELECT id FROM t_fts FACET brand ZEROES"
    expect: valid
    engines: { manticore: { since: "28.4" } }
  - sql: "SELECT @@version_comment"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE title LIKE 'red%'"
    expect: invalid
    engines: { manticore: {} }
    notes: ["No LIKE in WHERE (LIKE only filters SHOW / DESCRIBE output); use MATCH() or REGEX() on string attributes."]
  - sql: "SELECT id, price * 2 AS p, cat DIV 2 AS d, -cat AS n, cat | 4 AS b FROM t_fts"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT id FROM t_fts WHERE cat + 1 > 1"
    expect: invalid
    engines: { manticore: {} }
    notes: ["No arithmetic in WHERE; compute it in the select list and filter by the alias."]
  - sql: "SELECT id FROM t_fts WHERE meta.k[cat - 1] = 5"
    expect: valid
    engines: { manticore: {} }
  - sql: "SELECT t_fts.id FROM t_fts INNER JOIN t_cat ON t_fts.cat = int(t_cat.attrs.cid)"
    expect: valid
    engines: { manticore: { since: "27.1" } }
  - sql: "SELECT t_fts.id FROM t_fts INNER JOIN t_cat ON t_fts.cat = int(t_cat.cid)"
    expect: semantic-error
    engines: { manticore: { since: "27.1" } }
    notes: ["Explicit casts only on JSON attributes."]
  # --- Sphinx
  - sql: "SELECT id, WEIGHT() AS w FROM t_ft WHERE MATCH('apple') ORDER BY w DESC LIMIT 10"
    expect: valid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM t_ft WHERE MATCH('@title apple') AND cat = 1 AND price BETWEEN 1 AND 5"
    expect: valid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM t_ft WHERE cat IN (1, 2) AND MATCH('apple')"
    expect: valid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM t_ft WHERE MATCH('apple') AND (cat = 1 OR price > 2)"
    expect: valid
    engines: { sphinx: { since: "3" } }
  - sql: "SELECT id FROM t_ft WHERE MATCH('apple') AND (cat = 1 OR price > 2)"
    expect: invalid
    engines: { sphinx: { until: "3" } }
  - sql: "SELECT id FROM t_ft WHERE cat = 1 OR price > 2"
    expect: valid
    engines: { sphinx: { since: "3" } }
  - sql: "SELECT id FROM t_ft WHERE cat = 1 OR price > 2"
    expect: invalid
    engines: { sphinx: { until: "3" } }
  - sql: "SELECT id FROM t_ft WHERE MATCH('apple') AND cat = 1 OR price > 2"
    expect: invalid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM t_ft WHERE MATCH('apple') OR cat = 2"
    expect: invalid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM t_ft WHERE MATCH('apple') AND MATCH('pie')"
    expect: invalid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM t_ft WHERE (MATCH('apple'))"
    expect: valid
    engines: { sphinx: {} }
  - sql: "SELECT id, cat, price FROM t_ft GROUP 2 BY cat WITHIN GROUP ORDER BY price DESC ORDER BY cat ASC"
    expect: valid
    engines: { sphinx: {} }
  - sql: "SELECT cat, COUNT(*) AS c FROM t_ft GROUP BY cat HAVING c > 0 ORDER BY c DESC"
    expect: valid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM t_ft FACET cat FACET price ORDER BY COUNT(*) DESC"
    expect: valid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM t_ft LIMIT 0, 10"
    expect: valid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM t_ft LIMIT 10 OFFSET 0"
    expect: invalid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM probe_rt WHERE j.a.b = 1"
    expect: valid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM t_ft WHERE MATCH('apple') ORDER BY id"
    expect: invalid
    engines: { sphinx: {} }
  - sql: "SELECT t_ft.id FROM t_ft INNER JOIN probe_rt ON t_ft.cat = probe_rt.n"
    expect: invalid
    engines: { sphinx: {} }
  - sql: "SELECT id FROM t_ft WHERE title = 'red'"
    expect: semantic-error
    engines: { sphinx: {} }
  - sql: "SELECT 1"
    expect: valid
    engines: { sphinx: {} }
  # --- MySQL / MariaDB
  - sql: "SELECT id, MATCH(title, body) AGAINST ('apple') AS score FROM t_fts WHERE MATCH(title, body) AGAINST ('apple') ORDER BY score DESC LIMIT 10"
    expect: valid
    engines: { mysql: {}, mariadb: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH(title, body) AGAINST ('+apple -pear' IN BOOLEAN MODE)"
    expect: valid
    engines: { mysql: {}, mariadb: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH(title, body) AGAINST ('apple' WITH QUERY EXPANSION)"
    expect: valid
    engines: { mysql: {}, mariadb: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH(title, body) AGAINST ('apple' IN NATURAL LANGUAGE MODE) OR cat = 2"
    expect: valid
    engines: { mysql: {}, mariadb: {} }
    notes: ["MATCH in OR is fine here - the Manticore form is not."]
  - sql: "SELECT id FROM t_fts WHERE MATCH(title) AGAINST ('apple') AND NOT MATCH(title, body) AGAINST ('pie')"
    expect: valid
    engines: { mysql: {}, mariadb: {} }
  - sql: "SELECT id FROM t_fts WHERE MATCH(body) AGAINST ('apple')"
    expect: semantic-error
    engines: { mysql: {}, mariadb: {} }
    notes: ["No FULLTEXT index on exactly (body): error 1191."]
  - sql: "SELECT id FROM t_fts WHERE MATCH('apple')"
    expect: invalid
    engines: { mysql: {}, mariadb: {} }
    notes: ["The Manticore form."]
