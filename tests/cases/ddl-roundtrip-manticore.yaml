# yaml-language-server: $schema=../../schemas/test.schema.json
id: ddl-roundtrip-manticore
description: SHOW CREATE TABLE on Manticore - drop, re-run, compare columns (incl. field properties) and table types.
engines: [manticore]

setup:
  manticore:
    - "CREATE TABLE t_rt (title TEXT, body TEXT indexed, label STRING attribute indexed, n INT, b BIGINT engine='columnar', j JSON, m MULTI64, vec FLOAT_VECTOR knn_type='hnsw' knn_dims='3' hnsw_similarity='cosine') min_infix_len='3' morphology='stem_en' html_strip='1'"
    - "CREATE TABLE t_rt_pq (title TEXT, cat INT) type='percolate'"
    - "CREATE TABLE t_rt_dist type='distributed' local='t_rt'"

cleanup:
  manticore:
    - DROP TABLE IF EXISTS t_rt_dist
    - DROP TABLE IF EXISTS t_rt
    - DROP TABLE IF EXISTS t_rt_pq

steps:
  - roundtrip:
      operation: introspection.table-ddl
      params: { table: t_rt }
      drop: { manticore: [DROP TABLE t_rt] }
      compare:
        - { query: introspection.list-columns, params: { schema: "{{schema}}", table: t_rt } }
  - sql: { manticore: "SHOW TABLE t_rt SETTINGS" }
    expect:
      rows:
        - match: { Variable_name: settings }
          matches: { Value: "min_infix_len = 3" }
  - roundtrip:
      operation: introspection.table-ddl
      params: { table: t_rt_pq }
      drop: { manticore: [DROP TABLE t_rt_pq] }
      compare:
        - { query: introspection.list-columns, params: { schema: "{{schema}}", table: t_rt_pq } }
        - { query: introspection.list-tables, params: { schema: "{{schema}}" } }
  - roundtrip:
      operation: introspection.table-ddl
      params: { table: t_rt_dist }
      drop: { manticore: [DROP TABLE t_rt_dist] }
      compare:
        - { query: introspection.list-tables, params: { schema: "{{schema}}" } }
