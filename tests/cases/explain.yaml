# yaml-language-server: $schema=../../schemas/test.schema.json
id: explain
description: query.explain - estimated plan on every engine, actual plan where supported.
engines: [mysql, mariadb, postgresql, sqlserver, sqlite]

setup:
  mysql: &setup
    - CREATE TABLE t_x (id INT PRIMARY KEY, v INT)
    - INSERT INTO t_x VALUES (1, 10)
    - INSERT INTO t_x VALUES (2, 20)
  mariadb: *setup
  postgresql: *setup
  sqlserver: *setup
  sqlite: *setup
cleanup:
  mysql: &cleanup [DROP TABLE IF EXISTS t_x]
  mariadb: *cleanup
  postgresql: *cleanup
  sqlserver: *cleanup
  sqlite: *cleanup

steps:
  - operation: query.explain
    params: { sql: SELECT v FROM t_x WHERE id = 1 }
    params_by_engine:
      mysql: { format: JSON }
      mariadb: { format: JSON }
      postgresql: { format: YAML }
    expect:
      row_count: 1
      rows:
        - { match: {}, engine: mysql, until: "9", matches: { EXPLAIN: '"query_block"' } }
        - { match: {}, engine: mysql, since: "9", matches: { EXPLAIN: '"json_schema_version": "2.0"' } }
        - { match: {}, engine: mariadb, matches: { EXPLAIN: '"query_block"' } }
        - { match: {}, engine: postgresql, matches: { QUERY PLAN: 'Node Type: "Index Scan"' } }
        - { match: {}, engine: sqlserver, matches: { Microsoft SQL Server 2005 XML Showplan: '^<ShowPlanXML ' } }
        - { match: {}, engine: sqlite, matches: { detail: '^SEARCH (TABLE )?t_x USING ' } }
  - operation: query.explain
    engines: { mysql: { since: "8.0.18" }, mariadb: {}, postgresql: {} }
    params: { sql: SELECT v FROM t_x WHERE id = 1, analyze: true }
    params_by_engine:
      mariadb: { format: JSON }
      postgresql: { format: YAML }
    expect:
      row_count: 1
      rows:
        - { match: {}, engine: mysql, matches: { EXPLAIN: 'actual time=' } }
        - { match: {}, engine: mariadb, matches: { ANALYZE: '"r_total_time_ms"' } }
        - { match: {}, engine: postgresql, matches: { QUERY PLAN: 'Actual Rows: 1' } }
