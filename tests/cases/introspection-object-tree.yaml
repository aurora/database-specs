# yaml-language-server: $schema=../../schemas/test.schema.json
id: introspection-object-tree
description: >
  Object tree queries (schemas, views, routines, triggers, constraints, incoming foreign keys,
  sequences) on one fixture per engine.
engines: [mysql, mariadb, postgresql]

setup:
  mysql:
    - CREATE DATABASE IF NOT EXISTS s_ot
    - |
      CREATE TABLE t_ot (
        id INT PRIMARY KEY,
        code VARCHAR(20) NOT NULL,
        qty INT,
        CONSTRAINT uq_ot_code UNIQUE (code),
        CONSTRAINT chk_ot_qty CHECK (qty >= 0)
      )
    - |
      CREATE TABLE t_ot_child (
        id INT PRIMARY KEY,
        ot_id INT,
        CONSTRAINT fk_ot_child FOREIGN KEY (ot_id) REFERENCES t_ot (id) ON DELETE CASCADE
      )
    - CREATE VIEW v_ot AS SELECT id, qty FROM t_ot WHERE qty > 0 WITH CASCADED CHECK OPTION
    - CREATE FUNCTION f_ot(a INT) RETURNS INT DETERMINISTIC COMMENT 'doubles' RETURN a * 2
    - CREATE PROCEDURE p_ot(IN a INT, OUT b INT) SET b = a * 2
    - CREATE TRIGGER tr_ot BEFORE INSERT ON t_ot FOR EACH ROW SET NEW.qty = COALESCE(NEW.qty, 0)
  mariadb:
    - CREATE DATABASE IF NOT EXISTS s_ot COMMENT 'object tree'
    - |
      CREATE TABLE t_ot (
        id INT PRIMARY KEY,
        code VARCHAR(20) NOT NULL,
        qty INT,
        CONSTRAINT uq_ot_code UNIQUE (code),
        CONSTRAINT chk_ot_qty CHECK (qty >= 0)
      )
    - |
      CREATE TABLE t_ot_child (
        id INT PRIMARY KEY,
        ot_id INT,
        CONSTRAINT fk_ot_child FOREIGN KEY (ot_id) REFERENCES t_ot (id) ON DELETE CASCADE
      )
    - CREATE VIEW v_ot AS SELECT id, qty FROM t_ot WHERE qty > 0 WITH CASCADED CHECK OPTION
    - CREATE FUNCTION f_ot(a INT) RETURNS INT DETERMINISTIC COMMENT 'doubles' RETURN a * 2
    - CREATE PROCEDURE p_ot(IN a INT, OUT b INT) SET b = a * 2
    - CREATE TRIGGER tr_ot BEFORE INSERT ON t_ot FOR EACH ROW SET NEW.qty = COALESCE(NEW.qty, 0)
    - CREATE SEQUENCE seq_ot START WITH 10 INCREMENT BY 5
  postgresql:
    - CREATE SCHEMA s_ot
    - COMMENT ON SCHEMA s_ot IS 'object tree'
    - |
      CREATE TABLE t_ot (
        id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        code varchar(20) NOT NULL,
        qty integer,
        CONSTRAINT uq_ot_code UNIQUE (code) DEFERRABLE INITIALLY DEFERRED,
        CONSTRAINT chk_ot_qty CHECK (qty >= 0)
      )
    - |
      CREATE TABLE t_ot_child (
        id integer PRIMARY KEY,
        ot_id integer,
        CONSTRAINT fk_ot_child FOREIGN KEY (ot_id) REFERENCES t_ot (id) ON DELETE CASCADE
      )
    - CREATE VIEW v_ot AS SELECT id, qty FROM t_ot WHERE qty > 0 WITH CASCADED CHECK OPTION
    - CREATE MATERIALIZED VIEW mv_ot AS SELECT id FROM t_ot
    - CREATE FUNCTION f_ot(a integer) RETURNS integer LANGUAGE sql IMMUTABLE AS $$ SELECT a * 2 $$
    - COMMENT ON FUNCTION f_ot(integer) IS 'doubles'
    - CREATE PROCEDURE p_ot(IN a integer, INOUT b integer) LANGUAGE plpgsql AS $$ BEGIN b := a * 2; END $$
    - |
      CREATE FUNCTION trf_ot() RETURNS trigger LANGUAGE plpgsql
      AS $$ BEGIN NEW.qty := COALESCE(NEW.qty, 0); RETURN NEW; END $$
    - |
      CREATE TRIGGER tr_ot BEFORE INSERT OR UPDATE ON t_ot
      FOR EACH ROW WHEN (NEW.qty IS NULL) EXECUTE FUNCTION trf_ot()
    - CREATE SEQUENCE seq_ot START 10 INCREMENT 5

cleanup:
  mysql:
    - DROP VIEW IF EXISTS v_ot
    - DROP TABLE IF EXISTS t_ot_child
    - DROP TABLE IF EXISTS t_ot
    - DROP FUNCTION IF EXISTS f_ot
    - DROP PROCEDURE IF EXISTS p_ot
    - DROP DATABASE IF EXISTS s_ot
  mariadb:
    - DROP VIEW IF EXISTS v_ot
    - DROP TABLE IF EXISTS t_ot_child
    - DROP TABLE IF EXISTS t_ot
    - DROP FUNCTION IF EXISTS f_ot
    - DROP PROCEDURE IF EXISTS p_ot
    - DROP SEQUENCE IF EXISTS seq_ot
    - DROP DATABASE IF EXISTS s_ot
  postgresql:
    - DROP VIEW IF EXISTS v_ot
    - DROP MATERIALIZED VIEW IF EXISTS mv_ot
    - DROP TABLE IF EXISTS t_ot_child
    - DROP TABLE IF EXISTS t_ot
    - DROP FUNCTION IF EXISTS f_ot(integer)
    - DROP PROCEDURE IF EXISTS p_ot(integer, integer)
    - DROP FUNCTION IF EXISTS trf_ot()
    - DROP SEQUENCE IF EXISTS seq_ot
    - DROP SCHEMA IF EXISTS s_ot

steps:
  - query: introspection.list-schemas
    expect:
      rows:
        - match: { schema_name: s_ot }
          values: { is_system: false }
        - match: { schema_name: information_schema }
          values: { is_system: true }
        - match: { schema_name: s_ot }
          engine: mariadb
          values: { comment: object tree }
        - match: { schema_name: s_ot }
          engine: postgresql
          values: { comment: object tree, owner: postgres, default_charset: null }
        - match: { schema_name: pg_catalog }
          engine: postgresql
          values: { is_system: true }
        - match: { schema_name: mysql }
          engine: mysql
          values: { is_system: true }

  - query: introspection.list-views
    params: { schema: "{{schema}}" }
    expect:
      rows:
        - match: { view_name: v_ot }
          values: { is_materialized: false, is_updatable: true, check_option: cascaded, security_type: definer }
        - match: { view_name: v_ot }
          engine: mysql
          values: { definition: "select `dbspecs`.`t_ot`.`id` AS `id`,`dbspecs`.`t_ot`.`qty` AS `qty` from `dbspecs`.`t_ot` where (`dbspecs`.`t_ot`.`qty` > 0)" }
        - match: { view_name: v_ot }
          engine: mariadb
          values: { definition: "select `dbspecs`.`t_ot`.`id` AS `id`,`dbspecs`.`t_ot`.`qty` AS `qty` from `dbspecs`.`t_ot` where `dbspecs`.`t_ot`.`qty` > 0" }
        - match: { view_name: v_ot }
          engine: postgresql
          until: "16"
          values: { definition: "SELECT t_ot.id,\n    t_ot.qty\n   FROM t_ot\n  WHERE t_ot.qty > 0" }
        - match: { view_name: v_ot }
          engine: postgresql
          since: "16"
          values: { definition: "SELECT id,\n    qty\n   FROM t_ot\n  WHERE qty > 0" }
        - match: { view_name: mv_ot }
          engine: postgresql
          values: { is_materialized: true, is_updatable: false, security_type: null }

  - query: introspection.list-routines
    params: { schema: "{{schema}}" }
    expect:
      rows:
        - match: { routine_name: f_ot }
          values: { routine_type: function, is_deterministic: true, comment: doubles }
        - match: { routine_name: p_ot }
          values: { routine_type: procedure, return_type: null, is_deterministic: false }
        - match: { routine_name: f_ot }
          engine: mysql
          values: { specific_name: f_ot, language: sql, security_type: definer, definition: RETURN a * 2 }
        - match: { routine_name: p_ot }
          engine: mysql
          until: "8.0.19"
          values: { arguments: "IN a int(11), OUT b int(11)" }
        - match: { routine_name: p_ot }
          engine: mysql
          since: "8.0.19"
          values: { arguments: "IN a int, OUT b int" }
        - match: { routine_name: p_ot }
          engine: mariadb
          values: { arguments: "IN a int(11), OUT b int(11)", definition: SET b = a * 2 }
        - match: { routine_name: f_ot }
          engine: postgresql
          values: { specific_name: f_ot(a integer), arguments: a integer, return_type: integer, language: sql, security_type: invoker, definition: " SELECT a * 2 " }
        - match: { routine_name: p_ot }
          engine: postgresql
          until: "14"
          values: { arguments: "a integer, INOUT b integer", language: plpgsql }
        - match: { routine_name: p_ot }
          engine: postgresql
          since: "14"
          values: { arguments: "IN a integer, INOUT b integer", language: plpgsql }
        - match: { routine_name: trf_ot }
          engine: postgresql
          values: { return_type: trigger, arguments: "" }

  - query: introspection.list-triggers
    params: { schema: "{{schema}}", table: t_ot }
    expect:
      row_count: 1
      rows:
        - match: { trigger_name: tr_ot }
          values: { timing: before, level: row, is_enabled: true }
        - match: { trigger_name: tr_ot }
          engine: mysql
          values: { events: insert, action_order: 1, condition: null, action_statement: "SET NEW.qty = COALESCE(NEW.qty, 0)" }
        - match: { trigger_name: tr_ot }
          engine: mariadb
          values: { events: insert, action_order: 1, action_statement: "SET NEW.qty = COALESCE(NEW.qty, 0)" }
        - match: { trigger_name: tr_ot }
          engine: postgresql
          values: { events: "insert,update", action_order: null, condition: new.qty IS NULL, action_statement: EXECUTE FUNCTION trf_ot() }

  - query: introspection.list-constraints
    params: { schema: "{{schema}}", table: t_ot }
    expect:
      rows:
        - match: { constraint_type: primary-key }
          values: { column_name: id, column_position: 1, is_enforced: true }
        - match: { constraint_name: uq_ot_code }
          values: { constraint_type: unique, column_name: code, index_name: uq_ot_code }
        - match: { constraint_name: uq_ot_code }
          engine: postgresql
          values: { is_deferrable: true, initially_deferred: true }
        - match: { constraint_name: chk_ot_qty }
          engine: mysql
          since: "8.0.16"
          values: { constraint_type: check, column_name: null, check_expression: "(`qty` >= 0)", is_enforced: true }
        - match: { constraint_name: chk_ot_qty }
          engine: mariadb
          values: { constraint_type: check, check_expression: "`qty` >= 0" }
        - match: { constraint_name: chk_ot_qty }
          engine: postgresql
          values: { constraint_type: check, check_expression: (qty >= 0), index_name: null }
        - match: { constraint_type: primary-key }
          engine: mysql
          values: { constraint_name: PRIMARY }
        - match: { constraint_type: primary-key }
          engine: postgresql
          values: { constraint_name: t_ot_pkey, index_name: t_ot_pkey }

  - query: introspection.list-referencing-foreign-keys
    params: { schema: "{{schema}}", table: t_ot }
    expect:
      row_count: 1
      rows:
        - match: { constraint_name: fk_ot_child }
          values: { table_name: t_ot_child, column_name: ot_id, referenced_table: t_ot, referenced_column: id, on_delete: cascade }

  - query: introspection.list-sequences
    engines: { mariadb: { since: "11.8" }, postgresql: {} }
    params: { schema: "{{schema}}" }
    expect:
      rows:
        - match: { sequence_name: seq_ot }
          engine: mariadb
          values: { start_value: 10, increment: 5, is_cycle: false, data_type: bigint }
        - match: { sequence_name: seq_ot }
          engine: postgresql
          values: { start_value: 10, increment: 5, is_cycle: false, data_type: bigint, last_value: null, owned_by_table: null }
        - match: { sequence_name: t_ot_id_seq }
          engine: postgresql
          values: { data_type: integer, owned_by_table: t_ot, owned_by_column: id }
