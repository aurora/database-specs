# yaml-language-server: $schema=../../schemas/test.schema.json
id: introspection-schema-objects
description: list-tables, list-indexes and list-foreign-keys on a shared parent/child fixture.
engines: [mysql, mariadb, postgresql, sqlserver, sqlite]

setup:
  mysql: &mysql_setup
    - |
      CREATE TABLE t_parent (
        id INT PRIMARY KEY,
        code VARCHAR(20) NOT NULL,
        region INT NOT NULL,
        UNIQUE KEY uq_parent_code (code),
        UNIQUE KEY uq_parent_region_code (region, code)
      ) COMMENT 'parents'
    - |
      CREATE TABLE t_child (
        id INT PRIMARY KEY,
        parent_id INT,
        region INT,
        code VARCHAR(20),
        title VARCHAR(200),
        KEY ix_child_title (title(20)) COMMENT 'prefix index',
        KEY ix_child_multi (region, parent_id DESC),
        CONSTRAINT fk_child_parent FOREIGN KEY (parent_id) REFERENCES t_parent (id)
          ON DELETE CASCADE ON UPDATE SET NULL,
        CONSTRAINT fk_child_region_code FOREIGN KEY (region, code) REFERENCES t_parent (region, code)
      )
    - CREATE VIEW v_child AS SELECT id, title FROM t_child
    - |
      CREATE TABLE t_part (id INT, created DATE)
      PARTITION BY RANGE (YEAR(created)) (PARTITION p2026 VALUES LESS THAN (2027))
  mariadb: *mysql_setup
  postgresql:
    - |
      CREATE TABLE t_parent (
        id int PRIMARY KEY,
        code varchar(20) NOT NULL,
        region int NOT NULL,
        CONSTRAINT uq_parent_code UNIQUE (code),
        CONSTRAINT uq_parent_region_code UNIQUE (region, code)
      )
    - COMMENT ON TABLE t_parent IS 'parents'
    - |
      CREATE TABLE t_child (
        id int PRIMARY KEY,
        parent_id int,
        region int,
        code varchar(20),
        title varchar(200),
        CONSTRAINT fk_child_parent FOREIGN KEY (parent_id) REFERENCES t_parent (id)
          ON DELETE CASCADE ON UPDATE SET NULL,
        CONSTRAINT fk_child_region_code FOREIGN KEY (region, code) REFERENCES t_parent (region, code)
          DEFERRABLE INITIALLY DEFERRED
      )
    - CREATE INDEX ix_child_title ON t_child (lower(title))
    - COMMENT ON INDEX ix_child_title IS 'expression index'
    - CREATE INDEX ix_child_multi ON t_child (region, parent_id DESC NULLS LAST) INCLUDE (code) WHERE region > 0
    - CREATE VIEW v_child AS SELECT id, title FROM t_child
    - CREATE MATERIALIZED VIEW mv_child AS SELECT id FROM t_child
    - CREATE TABLE t_part (id int, created date) PARTITION BY RANGE (created)
    - CREATE TABLE t_part_2026 PARTITION OF t_part FOR VALUES FROM ('2026-01-01') TO ('2027-01-01')
  sqlserver:
    - |
      CREATE TABLE t_parent (
        id INT CONSTRAINT pk_parent PRIMARY KEY,
        code VARCHAR(20) NOT NULL,
        region INT NOT NULL,
        CONSTRAINT uq_parent_code UNIQUE (code),
        CONSTRAINT uq_parent_region_code UNIQUE (region, code)
      )
    - EXEC sp_addextendedproperty 'MS_Description', 'parents', 'SCHEMA', 'dbo', 'TABLE', 't_parent'
    - |
      CREATE TABLE t_child (
        id INT CONSTRAINT pk_child PRIMARY KEY,
        parent_id INT,
        region INT,
        code VARCHAR(20),
        title VARCHAR(200),
        CONSTRAINT fk_child_parent FOREIGN KEY (parent_id) REFERENCES t_parent (id)
          ON DELETE CASCADE ON UPDATE SET NULL,
        CONSTRAINT fk_child_region_code FOREIGN KEY (region, code) REFERENCES t_parent (region, code)
      )
    - CREATE INDEX ix_child_title ON t_child (title)
    - EXEC sp_addextendedproperty 'MS_Description', 'title index', 'SCHEMA', 'dbo', 'TABLE', 't_child', 'INDEX', 'ix_child_title'
    - CREATE INDEX ix_child_multi ON t_child (region, parent_id DESC) INCLUDE (code) WHERE region > 0
    - CREATE VIEW v_child AS SELECT id, title FROM t_child
    - CREATE PARTITION FUNCTION pf_dbspecs (date) AS RANGE RIGHT FOR VALUES ('2026-01-01')
    - CREATE PARTITION SCHEME ps_dbspecs AS PARTITION pf_dbspecs ALL TO ([PRIMARY])
    - CREATE TABLE t_part (id INT, created DATE) ON ps_dbspecs (created)
  sqlite:
    - |
      CREATE TABLE t_parent (
        id INT PRIMARY KEY,
        code VARCHAR(20) NOT NULL,
        region INT NOT NULL,
        CONSTRAINT uq_parent_code UNIQUE (code),
        CONSTRAINT uq_parent_region_code UNIQUE (region, code)
      )
    - |
      CREATE TABLE t_child (
        id INT PRIMARY KEY,
        parent_id INT,
        region INT,
        code VARCHAR(20),
        title VARCHAR(200),
        CONSTRAINT fk_child_parent FOREIGN KEY (parent_id) REFERENCES t_parent (id)
          ON DELETE CASCADE ON UPDATE SET NULL,
        CONSTRAINT fk_child_region_code FOREIGN KEY (region, code) REFERENCES t_parent (region, code)
      )
    - CREATE INDEX ix_child_title ON t_child (lower(title))
    - CREATE INDEX ix_child_multi ON t_child (region, parent_id DESC) WHERE region > 0
    - CREATE VIEW v_child AS SELECT id, title FROM t_child

cleanup:
  mysql: &mysql_cleanup
    - DROP VIEW IF EXISTS v_child
    - DROP TABLE IF EXISTS t_child
    - DROP TABLE IF EXISTS t_parent
    - DROP TABLE IF EXISTS t_part
  mariadb: *mysql_cleanup
  postgresql:
    - DROP MATERIALIZED VIEW IF EXISTS mv_child
    - DROP VIEW IF EXISTS v_child
    - DROP TABLE IF EXISTS t_child
    - DROP TABLE IF EXISTS t_parent
    - DROP TABLE IF EXISTS t_part
  sqlserver:
    - DROP VIEW IF EXISTS v_child
    - DROP TABLE IF EXISTS t_child
    - DROP TABLE IF EXISTS t_parent
    - DROP TABLE IF EXISTS t_part
    - IF EXISTS (SELECT 1 FROM sys.partition_schemes WHERE name = 'ps_dbspecs') DROP PARTITION SCHEME ps_dbspecs
    - IF EXISTS (SELECT 1 FROM sys.partition_functions WHERE name = 'pf_dbspecs') DROP PARTITION FUNCTION pf_dbspecs
  sqlite:
    - DROP VIEW IF EXISTS v_child
    - DROP TABLE IF EXISTS t_child
    - DROP TABLE IF EXISTS t_parent

steps:
  - query: introspection.list-tables
    params: { schema: "{{schema}}" }
    expect:
      rows:
        - match: { table_name: t_parent }
          values: { table_type: table, partition_of: null }
        - match: { table_name: t_child }
          values: { table_type: table, comment: null }
        - match: { table_name: v_child }
          values: { table_type: view, comment: null, storage_engine: null, row_estimate: null }
        - match: { table_name: t_part }
          engine: mysql
          values: { table_type: partitioned-table }
        - match: { table_name: t_parent }
          engine: mysql
          values: { comment: parents, storage_engine: InnoDB }
        - match: { table_name: t_part }
          engine: mariadb
          values: { table_type: partitioned-table }
        - match: { table_name: t_parent }
          engine: mariadb
          values: { comment: parents, storage_engine: InnoDB }
        - match: { table_name: t_part }
          engine: postgresql
          values: { table_type: partitioned-table }
        - match: { table_name: t_parent }
          engine: postgresql
          values: { comment: parents, storage_engine: heap, collation: null }
        - match: { table_name: t_part }
          engine: sqlserver
          values: { table_type: partitioned-table }
        - match: { table_name: t_parent }
          engine: sqlserver
          values: { comment: parents, storage_engine: null, collation: null, row_estimate: 0 }
        - match: { table_name: t_parent }
          engine: sqlite
          values: { storage_engine: rowid, comment: null, row_estimate: null }
        - match: { table_name: mv_child }
          engine: postgresql
          values: { table_type: materialized-view }
        - match: { table_name: t_part_2026 }
          engine: postgresql
          values: { table_type: table, partition_of: t_part }
        - match: { table_name: t_parent }
          engine: postgresql
          until: "14"
          values: { row_estimate: 0 }
        - match: { table_name: t_parent }
          engine: postgresql
          since: "14"
          values: { row_estimate: null }

  - query: introspection.list-indexes
    params: { schema: "{{schema}}", table: t_child }
    expect:
      rows:
        - match: { is_primary: true }
          values: { column_name: id, column_position: 1, is_unique: true, index_type: btree, sort_order: asc }
        - match: { index_name: ix_child_multi, column_position: 1 }
          values: { column_name: region, is_unique: false, sort_order: asc, is_included: false, index_type: btree }
        - match: { is_primary: true }
          engine: mysql
          values: { is_clustered: true }
        - match: { index_name: ix_child_multi, column_position: 1 }
          engine: mysql
          values: { is_clustered: false }
        - match: { is_primary: true }
          engine: mariadb
          values: { is_clustered: true }
        - match: { is_primary: true }
          engine: postgresql
          values: { is_clustered: null }
        # DESC: ignored by MySQL 5.7 and MariaDB < 10.8
        - match: { index_name: ix_child_multi, column_position: 2 }
          engine: mysql
          until: "8.0"
          values: { column_name: parent_id, sort_order: asc }
        - match: { index_name: ix_child_multi, column_position: 2 }
          engine: mysql
          since: "8.0"
          values: { column_name: parent_id, sort_order: desc }
        - match: { index_name: ix_child_multi, column_position: 2 }
          engine: mariadb
          until: "10.8"
          values: { column_name: parent_id, sort_order: asc }
        - match: { index_name: ix_child_multi, column_position: 2 }
          engine: mariadb
          since: "10.8"
          values: { column_name: parent_id, sort_order: desc }
        - match: { index_name: ix_child_multi, column_position: 2 }
          engine: postgresql
          values: { column_name: parent_id, sort_order: desc, nulls_first: false }
        # MySQL / MariaDB: prefix index with comment, auto-created FK indexes
        - match: { index_name: ix_child_title }
          engine: mysql
          values: { column_name: title, prefix_length: 20, comment: prefix index, expression: null }
        - match: { index_name: ix_child_title }
          engine: mariadb
          values: { column_name: title, prefix_length: 20, comment: prefix index }
        - match: { index_name: fk_child_parent }
          engine: mysql
          values: { column_name: parent_id }
        - match: { index_name: fk_child_parent }
          engine: mariadb
          values: { column_name: parent_id }
        # SQL Server: clustered primary key, INCLUDE, filtered index, index comment
        - match: { is_primary: true }
          engine: sqlserver
          values: { index_name: pk_child, is_clustered: true }
        - match: { index_name: ix_child_multi, column_position: 2 }
          engine: sqlserver
          values: { column_name: parent_id, sort_order: desc, nulls_first: null }
        - match: { index_name: ix_child_multi, column_position: 3 }
          engine: sqlserver
          values: { column_name: code, is_included: true, sort_order: null, predicate: "([region]>(0))" }
        - match: { index_name: ix_child_title }
          engine: sqlserver
          values: { column_name: title, is_clustered: false, comment: title index }
        # SQLite: autoindex for a non-INTEGER primary key, expression element without text
        - match: { is_primary: true }
          engine: sqlite
          values: { index_name: sqlite_autoindex_t_child_1, is_clustered: false }
        - match: { index_name: ix_child_multi, column_position: 2 }
          engine: sqlite
          values: { column_name: parent_id, sort_order: desc, predicate: region > 0 }
        - match: { index_name: ix_child_title }
          engine: sqlite
          values: { column_name: null, expression: null }
        # PostgreSQL: expression, INCLUDE, partial index
        - match: { index_name: ix_child_title }
          engine: postgresql
          values: { column_name: null, expression: "lower(title::text)", comment: expression index }
        - match: { index_name: ix_child_multi, column_position: 3 }
          engine: postgresql
          values: { column_name: code, is_included: true, sort_order: null, predicate: (region > 0) }

  - query: introspection.list-indexes
    params: { schema: "{{schema}}", table: t_parent }
    expect:
      row_count: 4
      rows:
        - match: { is_primary: true }
          values: { column_name: id }
        - match: { column_name: code, column_position: 1 }
          values: { is_unique: true, is_primary: false }
        - match: { column_name: code, column_position: 2 }
          values: { is_unique: true, is_primary: false }

  - query: introspection.list-foreign-keys
    params: { schema: "{{schema}}", table: t_child }
    expect:
      row_count: 3
      rows:
        - match: { column_name: parent_id }
          values:
            column_position: 1
            referenced_table: t_parent
            referenced_column: id
            on_update: set-null
            on_delete: cascade
        - match: { column_name: parent_id }
          engine: mysql
          values: { constraint_name: fk_child_parent, is_enforced: true }
        - match: { column_name: parent_id }
          engine: mariadb
          values: { constraint_name: fk_child_parent, is_enforced: true }
        - match: { column_name: parent_id }
          engine: postgresql
          values: { constraint_name: fk_child_parent, is_enforced: true }
        - match: { column_name: parent_id }
          engine: sqlserver
          values: { constraint_name: fk_child_parent, is_enforced: true }
        - match: { column_name: code }
          values: { column_position: 2, referenced_column: code }
        # default action when none is given
        - match: { column_name: region }
          engine: mysql
          until: "8.0"
          values: { on_update: restrict, on_delete: restrict }
        - match: { column_name: region }
          engine: mysql
          since: "8.0"
          values: { on_update: no-action, on_delete: no-action }
        - match: { column_name: region }
          engine: mariadb
          values: { on_update: restrict, on_delete: restrict, match_type: null, is_deferrable: false }
        - match: { column_name: region }
          engine: postgresql
          values: { on_update: no-action, on_delete: no-action, match_type: simple, is_deferrable: true, initially_deferred: true }
        - match: { column_name: region }
          engine: sqlserver
          values: { on_update: no-action, on_delete: no-action, match_type: null, is_deferrable: false }
        # SQLite: synthetic names (ids count from the last declared key), enforcement is per connection
        - match: { column_name: parent_id }
          engine: sqlite
          values: { constraint_name: fk_t_child_1, is_enforced: false, is_deferrable: null }
        - match: { column_name: region }
          engine: sqlite
          values: { constraint_name: fk_t_child_0, on_update: no-action, on_delete: no-action, match_type: null }
