# yaml-language-server: $schema=../../schemas/test.schema.json
id: list-columns-basic
description: introspection.list-columns on a table covering auto increment, defaults, generated columns, comments.
engines: [mysql, mariadb, postgresql, sqlserver, sqlite]
versions:
  sqlite: { since: "3.31" }  # generated columns

setup:
  mysql:
    - |
      CREATE TABLE t_columns (
        id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL COMMENT 'display name',
        price DECIMAL(10,2) NULL DEFAULT '0.00',
        qty INT NOT NULL DEFAULT 1,
        total DECIMAL(12,2) AS (price * qty) STORED,
        dropped_later INT,
        note TEXT
      )
    - ALTER TABLE t_columns DROP COLUMN dropped_later
  mariadb:
    - |
      CREATE TABLE t_columns (
        id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL COMMENT 'display name',
        price DECIMAL(10,2) NULL DEFAULT '0.00',
        qty INT NOT NULL DEFAULT 1,
        total DECIMAL(12,2) AS (price * qty) STORED,
        dropped_later INT,
        note TEXT
      )
    - ALTER TABLE t_columns DROP COLUMN dropped_later
  postgresql:
    - |
      CREATE TABLE t_columns (
        id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        name varchar(100) NOT NULL,
        price numeric(10,2) DEFAULT 0.00,
        qty integer NOT NULL DEFAULT 1,
        total numeric(12,2) GENERATED ALWAYS AS (price * qty) STORED,
        dropped_later integer,
        note text
      )
    - COMMENT ON COLUMN t_columns.name IS 'display name'
    - ALTER TABLE t_columns DROP COLUMN dropped_later
  sqlserver:
    - |
      CREATE TABLE t_columns (
        id INT IDENTITY(1,1) NOT NULL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        price DECIMAL(10,2) NULL DEFAULT 0.00,
        qty INT NOT NULL DEFAULT 1,
        total AS (price * qty) PERSISTED,
        dropped_later INT,
        note NVARCHAR(MAX)
      )
    - EXEC sp_addextendedproperty 'MS_Description', 'display name', 'SCHEMA', 'dbo', 'TABLE', 't_columns', 'COLUMN', 'name'
    - ALTER TABLE t_columns DROP COLUMN dropped_later
  sqlite:
    - sql: |
        CREATE TABLE t_columns (
          id INTEGER PRIMARY KEY,
          name VARCHAR(100) NOT NULL,
          price DECIMAL(10,2) DEFAULT 0.00,
          qty INT NOT NULL DEFAULT 1,
          total DECIMAL(12,2) GENERATED ALWAYS AS (price * qty) STORED,
          dropped_later INT,
          note TEXT
        )
      since: "3.35"
    - sql: ALTER TABLE t_columns DROP COLUMN dropped_later
      since: "3.35"
    - sql: |
        CREATE TABLE t_columns (
          id INTEGER PRIMARY KEY,
          name VARCHAR(100) NOT NULL,
          price DECIMAL(10,2) DEFAULT 0.00,
          qty INT NOT NULL DEFAULT 1,
          total DECIMAL(12,2) GENERATED ALWAYS AS (price * qty) STORED,
          note TEXT
        )
      until: "3.35"

cleanup:
  mysql: [DROP TABLE IF EXISTS t_columns]
  mariadb: [DROP TABLE IF EXISTS t_columns]
  postgresql: [DROP TABLE IF EXISTS t_columns]
  sqlserver: [DROP TABLE IF EXISTS t_columns]
  sqlite: [DROP TABLE IF EXISTS t_columns]

steps:
  - query: introspection.list-columns
    params: { schema: "{{schema}}", table: t_columns }
    expect:
      row_count: 6
      rows:
        - match: { column_name: id }
          values: { ordinal_position: 1, is_nullable: false, is_auto_increment: true, default_raw: null }
        - match: { column_name: name }
          values: { ordinal_position: 2, is_nullable: false }
        - match: { column_name: name }
          engine: mysql
          values: { comment: display name, data_type: varchar(100) }
        - match: { column_name: name }
          engine: mariadb
          values: { comment: display name, data_type: varchar(100) }
        - match: { column_name: price }
          engine: mariadb
          values: { default_raw: "0.00" }
        - match: { column_name: note }
          engine: mariadb
          values: { default_raw: null }
        - match: { column_name: id }
          engine: mariadb
          values: { data_type: int(11) }
        - match: { column_name: name }
          engine: postgresql
          values: { comment: display name, data_type: character varying(100) }
        - match: { column_name: price }
          values: { is_nullable: true, is_auto_increment: false }
        - match: { column_name: qty }
          engine: mysql
          values: { default_raw: "1" }
        - match: { column_name: qty }
          engine: mariadb
          values: { default_raw: "1" }
        - match: { column_name: qty }
          engine: postgresql
          values: { default_raw: "1" }
        - match: { column_name: total }
          values: { generation_kind: stored, default_raw: null }
        - match: { column_name: note }
          values: { ordinal_position: 6, comment: null }
        - match: { column_name: id }
          engine: mysql
          until: "8.0.19"
          values: { data_type: int(11) }
        - match: { column_name: id }
          engine: mysql
          since: "8.0.19"
          values: { data_type: int }
        - match: { column_name: id }
          engine: postgresql
          values: { data_type: integer }
        - match: { column_name: qty }
          engine: sqlserver
          values: { default_raw: "((1))", data_type: int }
        - match: { column_name: name }
          engine: sqlserver
          values: { comment: display name, data_type: varchar(100) }
        - match: { column_name: price }
          engine: sqlserver
          values: { default_raw: "((0.00))", data_type: "decimal(10,2)" }
        - match: { column_name: total }
          engine: sqlserver
          values: { generation_expression: "([price]*[qty])" }
        - match: { column_name: note }
          engine: sqlserver
          values: { data_type: nvarchar(max) }
        - match: { column_name: id }
          engine: sqlite
          values: { data_type: INTEGER, comment: null, collation: null }
        - match: { column_name: qty }
          engine: sqlite
          values: { default_raw: "1", data_type: INT }
        - match: { column_name: price }
          engine: sqlite
          values: { default_raw: "0.00", data_type: "DECIMAL(10,2)" }
