# yaml-language-server: $schema=../../schemas/test.schema.json
id: table-editing
description: >
  Table editor operations applied one after another, each verified by introspection or SQL;
  row operations on a table without a unique key must touch exactly one of two identical rows.
engines: [mysql, mariadb, postgresql]

setup:
  mysql: &mysql_setup
    - CREATE TABLE t_ed_ref (id INT PRIMARY KEY)
    - CREATE TABLE t_ed (id INT PRIMARY KEY, name VARCHAR(50))
    - CREATE TABLE t_dup (a INT, b VARCHAR(10))
    - INSERT INTO t_ed_ref (id) VALUES (1)
    - INSERT INTO t_dup (a, b) VALUES (1, 'x'), (1, 'x')
  mariadb: *mysql_setup
  postgresql:
    - CREATE TABLE t_ed_ref (id integer PRIMARY KEY)
    - CREATE TABLE t_ed (id integer PRIMARY KEY, name varchar(50))
    - CREATE TABLE t_dup (a integer, b varchar(10))
    - INSERT INTO t_ed_ref (id) VALUES (1)
    - INSERT INTO t_dup (a, b) VALUES (1, 'x'), (1, 'x')

cleanup:
  mysql: &mysql_cleanup
    - DROP TABLE IF EXISTS t_ed
    - DROP TABLE IF EXISTS t_ed2
    - DROP TABLE IF EXISTS t_ed_ref
    - DROP TABLE IF EXISTS t_dup
  mariadb: *mysql_cleanup
  postgresql: *mysql_cleanup

steps:
  # --- columns ----------------------------------------------------------------
  - operation: ddl.add-column
    params: { table: t_ed, column: qty, column_definition: INT NOT NULL DEFAULT 0, after: id }
  - query: introspection.list-columns
    params: { schema: "{{schema}}", table: t_ed }
    expect:
      rows:
        - match: { column_name: qty }
          values: { is_nullable: false }
        - match: { column_name: qty }
          engine: mysql
          values: { ordinal_position: 2 }
        - match: { column_name: qty }
          engine: mariadb
          values: { ordinal_position: 2 }
        - match: { column_name: qty }
          engine: postgresql
          values: { ordinal_position: 3 }

  - operation: ddl.rename-column
    params: { table: t_ed, column: name, new_name: title, column_definition: VARCHAR(50) }
  - operation: ddl.set-column-default
    params: { table: t_ed, column: qty, default: "5" }
  - operation: ddl.set-column-nullable
    params: { table: t_ed, column: title, nullable: false, column_definition: VARCHAR(50) NOT NULL }
  - query: introspection.list-columns
    params: { schema: "{{schema}}", table: t_ed }
    expect:
      rows:
        - match: { column_name: name }
          count: 0
        - match: { column_name: title }
          values: { is_nullable: false }
        - match: { column_name: qty }
          values: { default_raw: "5" }

  - operation: ddl.set-column-default
    params: { table: t_ed, column: qty }
  - query: introspection.list-columns
    params: { schema: "{{schema}}", table: t_ed }
    expect:
      rows:
        - match: { column_name: qty }
          values: { default_raw: null }

  # --- indexes and foreign keys ---------------------------------------------
  - operation: ddl.create-index
    params: { table: t_ed, index: ix_ed_title, columns: title, unique: true }
  - operation: ddl.add-column
    params: { table: t_ed, column: ref_id, column_definition: INT }
  - operation: ddl.add-foreign-key
    params: { table: t_ed, constraint: fk_ed_ref, columns: ref_id, referenced_table: t_ed_ref, referenced_columns: id, on_delete: SET NULL }
  - query: introspection.list-indexes
    params: { schema: "{{schema}}", table: t_ed }
    expect:
      rows:
        - match: { index_name: ix_ed_title }
          values: { is_unique: true, column_name: title }
  - query: introspection.list-foreign-keys
    params: { schema: "{{schema}}", table: t_ed }
    expect:
      row_count: 1
      rows:
        - match: { constraint_name: fk_ed_ref }
          values: { column_name: ref_id, referenced_table: t_ed_ref, on_delete: set-null }

  - operation: ddl.drop-foreign-key
    params: { table: t_ed, constraint: fk_ed_ref }
  - operation: ddl.drop-index
    params: { table: t_ed, index: ix_ed_title, schema: "{{schema}}" }
  - query: introspection.list-foreign-keys
    params: { schema: "{{schema}}", table: t_ed }
    expect: { row_count: 0 }
  - query: introspection.list-indexes
    params: { schema: "{{schema}}", table: t_ed }
    expect:
      rows:
        - match: { index_name: ix_ed_title }
          count: 0
        # InnoDB keeps the index it created for the foreign key
        - match: { index_name: fk_ed_ref }
          engine: mysql
          values: { column_name: ref_id }
        - match: { index_name: fk_ed_ref }
          engine: mariadb
          values: { column_name: ref_id }

  - operation: ddl.drop-index
    engines: { mysql: {}, mariadb: {} }
    params: { table: t_ed, index: fk_ed_ref }
  - operation: ddl.drop-column
    params: { table: t_ed, column: ref_id }
  - query: introspection.list-columns
    params: { schema: "{{schema}}", table: t_ed }
    expect:
      row_count: 3
      rows:
        - match: { column_name: ref_id }
          count: 0

  # --- rows -------------------------------------------------------------------
  - operation: dml.insert-row
    params: { table: t_ed, columns: "id, title, qty", values: "1, 'a', 3" }
  - operation: dml.update-row
    params: { table: t_ed, assignments: qty = 4, key_predicate: id = 1 }
  - sql:
      mysql: SELECT qty FROM t_ed WHERE id = 1
      mariadb: SELECT qty FROM t_ed WHERE id = 1
      postgresql: SELECT qty FROM t_ed WHERE id = 1
    expect:
      row_count: 1
      rows:
        - match: {}
          values: { qty: 4 }

  - operation: dml.insert-row
    engines: { mariadb: {}, postgresql: {} }
    params: { table: t_ed, columns: "id, title, qty", values: "2, 'b', 7", returning: "id, qty" }
    expect:
      rows:
        - match: {}
          values: { id: 2, qty: 7 }

  - operation: dml.insert-row
    params: { table: t_ed, columns: "id, title, qty", values: "3, 'c', 1" }
  - operation: query.browse-table
    params: { table: t_ed, where: id >= 1, order_by: id DESC, limit: 1, offset: 0 }
    expect:
      row_count: 1
      rows:
        - match: {}
          values: { id: 3, title: c }
  - operation: query.browse-table
    params: { table: t_ed, where: id = 3, limit: 1, offset: 0 }
    expect:
      row_count: 1
      rows:
        - match: {}
          values: { id: 3 }

  - operation: dml.update-row
    params: { table: t_dup, assignments: b = 'y', key_predicate: a = 1 AND b = 'x', no_unique_key: true }
  - sql:
      mysql: SELECT COUNT(*) AS n FROM t_dup WHERE b = 'y'
      mariadb: SELECT COUNT(*) AS n FROM t_dup WHERE b = 'y'
      postgresql: SELECT COUNT(*) AS n FROM t_dup WHERE b = 'y'
    expect:
      rows:
        - match: {}
          values: { n: 1 }
  - operation: dml.delete-row
    params: { table: t_dup, key_predicate: a = 1 AND b = 'y', no_unique_key: true }
  - sql:
      mysql: SELECT COUNT(*) AS n FROM t_dup
      mariadb: SELECT COUNT(*) AS n FROM t_dup
      postgresql: SELECT COUNT(*) AS n FROM t_dup
    expect:
      rows:
        - match: {}
          values: { n: 1 }

  # --- whole tables -------------------------------------------------------------
  - operation: ddl.truncate-table
    params: { table: t_dup }
  - sql:
      mysql: SELECT COUNT(*) AS n FROM t_dup
      mariadb: SELECT COUNT(*) AS n FROM t_dup
      postgresql: SELECT COUNT(*) AS n FROM t_dup
    expect:
      rows:
        - match: {}
          values: { n: 0 }
  - operation: ddl.rename-table
    params: { table: t_ed, new_name: t_ed2 }
  - operation: ddl.drop-table
    params: { table: t_dup }
  - query: introspection.list-tables
    params: { schema: "{{schema}}" }
    expect:
      rows:
        - match: { table_name: t_ed2 }
          values: { table_type: table }
        - match: { table_name: t_ed }
          count: 0
        - match: { table_name: t_dup }
          count: 0
