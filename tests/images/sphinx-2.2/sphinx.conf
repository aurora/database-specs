# Test fixture: Sphinx 2.x has no CREATE TABLE - real-time indexes are declared here.
# probe_rt: every attribute type once; t_ft: full-text syntax examples; t_ed: editing tests.
index probe_rt
{
    type              = rt
    path              = /var/lib/sphinx/probe_rt
    rt_field          = title
    rt_field          = body
    rt_attr_uint      = n
    rt_attr_bigint    = b
    rt_attr_float     = f
    rt_attr_bool      = ok
    rt_attr_timestamp = ts
    rt_attr_string    = s
    rt_attr_json      = j
    rt_attr_multi     = m
    rt_attr_multi_64  = m64
    dict              = keywords
}

index t_ft
{
    type              = rt
    path              = /var/lib/sphinx/t_ft
    rt_field          = title
    rt_field          = body
    rt_attr_uint      = cat
    rt_attr_uint      = price
    dict              = keywords
    min_infix_len     = 2
    html_strip        = 1
    index_zones       = h*, th
}

index t_ed
{
    type              = rt
    path              = /var/lib/sphinx/t_ed
    rt_field          = title
    rt_attr_uint      = n
    rt_attr_string    = s
}

searchd
{
    listen            = 9306:mysql41
    log               = /var/log/sphinx/searchd.log
    query_log         = /var/log/sphinx/query.log
    pid_file          = /var/run/sphinx/searchd.pid
    binlog_path       = /var/lib/sphinx
    workers           = threads
}
