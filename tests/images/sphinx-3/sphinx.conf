# Test fixture: Sphinx 3 config syntax (field / attr_*); the same fixture indexes as tests/images/sphinx-2.2.
# probe_rt: every attribute type once; t_ft: full-text syntax examples; t_ed: editing tests.
common
{
    datadir           = /var/lib/sphinx/data
}

index probe_rt
{
    type              = rt
    field             = title
    field             = body
    attr_uint         = n
    attr_bigint       = b
    attr_float        = f
    attr_bool         = ok
    attr_string       = s
    attr_json         = j
    attr_uint_set     = m
    attr_bigint_set   = m64
}

index t_ft
{
    type              = rt
    field             = title
    field             = body
    attr_uint         = cat
    attr_uint         = price
    min_infix_len     = 2
    html_strip        = 1
    index_zones       = h*, th
}

index t_ed
{
    type              = rt
    field             = title
    attr_uint         = n
    attr_string       = s
}

searchd
{
    listen            = 9306:mysql41

}
